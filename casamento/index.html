<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;color:#3b3124;background:#F7F1E6;background-image:radial-gradient(circle at 10% 0,#fff6df 0,transparent 45%),radial-gradient(circle at 100% 35%,#f1e2c6 0,transparent 45%);-webkit-font-smoothing:antialiased}

.search{border:1px solid rgba(176,141,87,.15);border-radius:14px;padding:11px 14px;font-size:14px;color:#9a8a70}.chip{font-size:12px;font-weight:600;padding:7px 12px;border-radius:18px;border:1px solid rgba(176,141,87,.15)}
.tl{display:grid;grid-template-columns:54px 16px 1fr;gap:10px}.tl .d{text-align:right;font-size:11px;font-weight:700;color:#B08D57}.tl .k{display:flex;flex-direction:column;align-items:center}.tl .k span{width:11px;height:11px;border-radius:50%;border:2px solid #B08D57;margin-top:3px}.tl .k i{flex:1;width:1px;background:rgba(176,141,87,.15)}

.empty{padding:12px 0}.banner{background:#B08D5722;color:#8a6a35;border-radius:14px;padding:9px 12px;font-size:12px;font-weight:700;text-align:center}

.btn-gold{width:100%;border:0;background:#B08D57;color:#fff;border-radius:16px;padding:14px;font-weight:700;font-size:16px;margin-top:16px;cursor:pointer}

#ptr{position:fixed;z-index:8;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-40px);transition:transform .28s cubic-bezier(.2,.9,.3,1),opacity .28s}
#ptr.drag{transition:none}
#ptr .bubble{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.92);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(150,120,60,.16)}
#ptr .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(176,141,87,.22);border-top-color:#B08D57;border-right-color:rgba(176,141,87,.55)}
#ptr.busy .spin{animation:ptrrot .65s linear infinite}
@keyframes ptrrot{to{transform:rotate(360deg)}}
#ptr-note{position:fixed;z-index:8;left:0;right:0;top:calc(env(safe-area-inset-top) + 18px);text-align:center;font-size:12px;font-weight:600;letter-spacing:.01em;color:#3b3124;opacity:0;pointer-events:none;transition:opacity .35s}
#ptr-note.show{opacity:.72}
</style></head><body>
<div id="ptr" aria-hidden="true"><div class="bubble"><div class="spin"></div></div></div>

<div class="wrap" id="app"><div class="full sub">Carregando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var D=null,TAB='resumo',MES=null,CRF='todos',F={q:'',cat:'',fornecedor:'',tipo:''};
var AC='#B08D57',AC2='#D9C29A',MU='#9a8a70',TRK='rgba(176,141,87,.15)',PAL=['#B08D57','#C9A96A','#8E7550','#D8BF8E','#A3865E','#E3D1AE'];
var MN=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'],MNL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var ICO={resumo:['◉','Resumo'],mes:['▦','Mês'],gastos:['☰','Gastos'],crono:['◷','Cronograma'],conv:['<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8.2" cy="12" r="6"/><circle cx="15.8" cy="12" r="6"/></svg>','Convidados']};
function b(v){return 'R$ '+Math.round(v||0).toLocaleString('pt-BR')}
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function q(s){return e(JSON.stringify(String(s)))}
var hoje=function(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)};
function dl(iso){return new Date(iso+'T12:00')}
function torreSvg(){return '<svg class="torre" viewBox="0 0 80 150" fill="none" stroke="#B08D57" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M40 3v16M33 19h14M33 19 36 40h8l3-21M29 40h22M29 40 23 66h34l-6-26M18 66h44M23 66 8 142M57 66 72 142M16 142c8-40 40-40 48 0M4 142h16M60 142h16M36 30h8M26 53h28M22 84h36"/></svg>'}
function head(t){var d=dl(hoje());var w=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getDay()];var cas=t==='Casamento';return '<div class="full hd">'+(cas?torreSvg():'')+'<div class="kick">'+w+', '+d.getDate()+' de '+MNL[d.getMonth()].toLowerCase()+'</div><div class="ttl">'+t+'</div>'+(cas?'<div class="orn" style="text-align:left;margin-top:4px">❦ Débora &amp; Diego ❦</div>':'')+'</div>'+(D.exemplo?'<div class="full banner">DADOS DE EXEMPLO</div>':'')}
var STC={'Pendente':'#D9822B','Concluído':'#4C9A6A','previsto':MU,'atrasada':'#C0392B','pago':'#4C9A6A'},STL={previsto:'Previsto',atrasada:'Atrasado',pago:'Pago'};
function st(s){var c=STC[s]||AC;return '<span class="pill" style="background:'+c+'22;color:'+c+'">'+e(STL[s]||s)+'</span>'}
function dstack(iso){if(!iso)return '<div style="width:44px;text-align:center;font-size:10px;font-weight:700;color:'+MU+'">S/<br>DATA</div>';var d=dl(iso);return '<div style="width:44px;text-align:center;font-size:11px;font-weight:700;color:'+AC+'">'+('0'+d.getDate()).slice(-2)+'<br>'+MN[d.getMonth()]+'</div>'}
function bar(p,c,h){return '<div class="bar"'+(h?' style="height:'+h+'px"':'')+'><i style="width:'+Math.max(0,Math.min(100,p)).toFixed(1)+'%;background:'+c+'"></i></div>'}
function mrow(m){return '<div class="row li tap" onclick="openSheet('+q(m.fornecedor||m.desc)+')"><div style="display:flex;gap:10px;align-items:center">'+dstack(m.data)+'<div><div class="b">'+e(m.fornecedor||'—')+'</div><div class="sub">'+e(m.desc)+' · '+e(m.parcela)+'</div></div></div><div style="text-align:right"><div class="b">'+b(m.valor)+'</div>'+st(m.status)+'</div></div>'}
function dias(){return D.dataCasamento?Math.round((dl(D.dataCasamento)-dl(hoje()))/864e5):null}
/* ---------- RESUMO ---------- */
function vResumo(){var T=D.totais,dd=dias(),cats=D.categorias.filter(function(c){return c.projecao>0}).slice(0,6),mx=Math.max.apply(null,cats.map(function(c){return c.projecao}).concat([1]));
  var pp=T.fechado?T.pago/T.fechado*100:0,pr=T.meta?T.projecao/T.meta*100:0,pf=T.meta?T.fechado/T.meta*100:0;
  var pend=D.cronograma.filter(function(c){return c.status!=='Concluído'}).slice(0,3);
  var prox=D.movimentos.filter(function(m){return m.status!=='pago'&&m.data}).sort(function(a,c){return a.data<c.data?-1:1}).slice(0,3);
  var dt=D.dataCasamento?dl(D.dataCasamento):null;
  var cd=dd==null?'<div class="sub">Data a definir</div>':dd<=0?'<div class="h" style="font-size:26px">💐 Casados!</div>':'<div class="cd"><div><b>'+Math.floor(dd/30)+'</b><span>meses</span></div><div><b>'+(dd%30)+'</b><span>dias</span></div><div><b>'+dd+'</b><span>dias no total</span></div></div>';
  return head('Casamento')
  +'<div class="card"><h3>Le grand jour'+(dt?' · '+dt.getDate()+' de '+MNL[dt.getMonth()].toLowerCase()+' de '+dt.getFullYear():'')+'</h3>'+cd+'</div>'
  +'<div class="card"><h3>Contratado</h3><div class="big">'+b(T.fechado)+'</div><div class="bar" style="margin:14px 0 10px;height:8px"><i style="width:'+pp.toFixed(1)+'%;background:'+AC+'"></i></div><div class="row" style="font-size:13px"><span><span class="dot" style="background:'+AC+'"></span><b>Pago</b> '+b(T.pago)+'</span><span><span class="dot" style="background:'+AC2+'"></span><b>Restante</b> '+b(T.aPagar)+'</span></div></div>'
  +'<div class="card"><h3>Meta</h3><div class="row"><div><div class="sub">Meta</div><div class="h" style="font-size:24px;font-weight:600">'+b(T.meta)+'</div></div><div style="text-align:right"><div class="sub">Saldo projetado</div><div class="h" style="font-size:24px;font-weight:600;color:'+(T.saldo<0?'#C0392B':AC)+'">'+b(T.saldo)+'</div></div></div>'
   +'<div class="bar" style="margin:12px 0 8px;height:8px"><i style="width:'+Math.min(100,pf).toFixed(1)+'%;background:'+AC+'"></i><i style="width:'+Math.max(0,Math.min(100,pr)-pf).toFixed(1)+'%;background:'+AC2+'"></i></div><div class="row sub"><span>Fechado '+b(T.fechado)+'</span><span>Projeção '+b(T.projecao)+' · '+Math.round(pr)+'%</span></div></div>'
  +'<div class="card"><h3>Por categoria · projeção</h3>'+cats.map(function(c,i){return '<div class="tap" style="padding:8px 0" onclick="openSheet('+q('cat:'+c.nome)+')"><div class="row"><span style="font-size:15px"><span class="dot" style="background:'+PAL[i%6]+'"></span>'+e(c.nome)+'</span><span class="b">'+b(c.projecao)+' ›</span></div><div class="bar" style="margin-top:7px"><i style="width:'+(c.projecao/mx*100).toFixed(1)+'%;background:'+PAL[i%6]+'"></i></div></div>'}).join('')+'</div>'
  +'<div class="card"><h3>Próximos passos</h3>'+(pend.length?pend.map(function(c){return '<div class="row li"><div style="display:flex;gap:10px;align-items:center">'+dstack(c.data)+'<div><div class="b">'+e(c.tarefa)+'</div><div class="sub">'+e(c.resp)+'</div></div></div>'+st(c.status)+'</div>'}).join(''):'<div class="sub empty">Nada pendente</div>')+'<div class="sub tap" style="margin-top:10px;color:'+AC+';font-weight:600" onclick="go(\'crono\')">Ver cronograma completo ›</div></div>'
  +'<div class="card"><h3>Próximos pagamentos</h3>'+(prox.length?prox.map(mrow).join(''):'<div class="sub empty">Nada a pagar</div>')+'</div>'
  +'<div class="full sub" style="text-align:center">Fonte: '+e(D.fonte)+' · atualizado '+e((D.geradoEm||'').slice(0,16).replace('T',' '))+'</div>'}
/* ---------- MÊS ---------- */
function ym(s){return (s||'').slice(0,7)}
function shift(k){var y=+MES.slice(0,4),m=+MES.slice(5,7)-1+k,d=new Date(y,m,1);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
function vMes(){if(!MES)MES=ym(hoje());var M={};D.movimentos.forEach(function(m){if(!m.data)return;var a=M[ym(m.data)]=M[ym(m.data)]||[0,0];a[m.status==='pago'?0:1]+=m.valor});
  var ks=Object.keys(M);if(ks.indexOf(MES)<0)ks.push(MES);ks.sort();var mx=Math.max.apply(null,Object.keys(M).map(function(k){return M[k][0]+M[k][1]}).concat([1]));
  var bars=ks.map(function(k){var v=M[k]||[0,0],on=k===MES;return '<div class="tap" onclick="MES=\''+k+'\';render()" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="height:110px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;'+(on?'outline:1.5px solid '+AC+';outline-offset:2px;border-radius:4px':'')+'"><i style="display:block;height:'+(v[1]/mx*110).toFixed(0)+'px;background:'+AC2+';border-radius:4px 4px 0 0"></i><i style="display:block;height:'+(v[0]/mx*110).toFixed(0)+'px;background:'+AC+'"></i></div><span style="font-size:9px;color:'+(on?AC:MU)+';font-weight:'+(on?700:400)+'">'+MN[+k.slice(5)-1]+'/'+k.slice(2,4)+'</span></div>'}).join('');
  var mm=D.movimentos.filter(function(m){return ym(m.data)===MES}),pg=0,fa=0;mm.forEach(function(m){if(m.status==='pago')pg+=m.valor;else fa+=m.valor});
  var hist=D.movimentos.filter(function(m){return m.data&&ym(m.data)<MES}),fut=D.movimentos.filter(function(m){return m.data&&ym(m.data)>MES}),sem=D.movimentos.filter(function(m){return !m.data&&m.status!=='pago'}).length;
  var y=+MES.slice(0,4),mi=+MES.slice(5,7)-1;
  return head('Mês')+'<div class="card full"><div class="row"><span class="nav" style="color:'+AC+'" onclick="MES=shift(-1);render()">‹</span><span class="h" style="font-size:24px;font-weight:600">'+MNL[mi]+' '+y+'</span><span class="nav" style="color:'+AC+'" onclick="MES=shift(1);render()">›</span></div>'
  +'<div class="row" style="margin-top:14px"><div><div class="sub">Pago no mês</div><div class="h" style="font-size:24px;font-weight:600">'+b(pg)+'</div></div><div style="text-align:right"><div class="sub">Falta no mês</div><div class="h" style="font-size:24px;font-weight:600">'+b(fa)+'</div></div></div></div>'
  +'<div class="card full"><h3>Mês a mês</h3><div style="display:flex;gap:4px">'+bars+'</div><div class="row sub" style="margin-top:10px"><span><span class="dot" style="background:'+AC+'"></span>Pago</span><span><span class="dot" style="background:'+AC2+'"></span>Previsto / em aberto</span></div></div>'
  +'<div class="card full"><h3>Contas de '+MNL[mi].toLowerCase()+'</h3>'+(mm.length?mm.map(mrow).join(''):'<div class="sub empty">Nenhuma conta com vencimento em '+MNL[mi].toLowerCase()+'/'+y+'.</div>')+'</div>'
  +(hist.length?'<div class="card"><h3>Histórico · pago e em atraso</h3>'+hist.map(mrow).join('')+'</div>':'')
  +'<div class="card"><h3>Próximos meses</h3>'+(fut.length?fut.slice(0,5).map(mrow).join(''):'<div class="sub empty">Nada previsto</div>')+(sem?'<div class="sub" style="margin-top:10px">+ '+sem+' pagamento'+(sem>1?'s':'')+' previsto'+(sem>1?'s':'')+' sem data</div>':'')+'</div>'}
/* ---------- GASTOS ---------- */
function uniq(k){var s={};D.gastos.forEach(function(g){if(g[k])s[g[k]]=1});return Object.keys(s).sort()}

function vGastos(){var L=D.gastos.filter(function(g){var t=(g.desc+' '+g.fornecedor+' '+g.obs+' '+g.cat).toLowerCase();return (!F.q||t.indexOf(F.q.toLowerCase())>=0)&&(!F.cat||g.cat===F.cat)&&(!F.fornecedor||g.fornecedor===F.fornecedor)&&(!F.tipo||g.tipo===F.tipo)});
  var fo={};L.forEach(function(g){(fo[g.fornecedor||'Sem fornecedor']=fo[g.fornecedor||'Sem fornecedor']||[]).push(g)});
  var val=function(g){return g.tipo==='fechado'?g.fechado:g.tipo==='cancelado'?0:g.orcado};
  var rows=Object.keys(fo).map(function(f){var gs=fo[f],tot=0,pg=0;gs.forEach(function(g){tot+=val(g);pg+=g.pago});return [f,gs,tot,pg]}).sort(function(a,c){return c[2]-a[2]});

  +'<div class="card full">'+(rows.length?rows.map(function(r){var cs={};r[1].forEach(function(g){cs[g.cat]=1});return '<div class="li tap" onclick="openSheet('+q(r[0])+')"><div class="row"><div><div class="b">'+e(r[0])+'</div><div class="sub">'+r[1].length+(r[1].length===1?' item':' itens')+' · '+e(Object.keys(cs).slice(0,2).join(', '))+'</div></div><div class="b">'+b(r[2])+'</div></div><div class="bar" style="margin-top:6px;height:4px"><i style="width:'+(r[2]?r[3]/r[2]*100:0).toFixed(0)+'%;background:'+AC+'"></i></div></div>'}).join(''):'<div class="sub empty">Nenhum item</div>')+'</div>'}

function cvQtd(c){var n=parseInt(c&&c.qtd,10);return n>0?n:1}
function cvSent(c){
  if(!c)return false;
  if(c.enviado===true||c.enviado==='true'||c.enviado===1||c.enviado==='1')return true;
  if(c.envio===true||c.envio==='enviado'||c.envio==='true'||c.envio===1)return true;
  return false;
}
function cvUi(c){var s=c&&c.status;if(s==='confirmado')return 'confirmado';if(s==='recusado')return 'recusado';return cvSent(c)?'enviado':'aenviar'}
function cvStatusPatch(ui){
  if(ui==='enviado')return {enviado:true,status:'pendente'};
  if(ui==='confirmado')return {status:'confirmado'};
  if(ui==='recusado')return {status:'recusado'};
  return {enviado:false,status:'pendente'};
}
function cvSame(a,b){
  if(a===b)return true;
  if(typeof a==='number'&&typeof b==='number')return false;
  if(typeof a==='boolean'&&typeof b==='boolean')return false;
  return String(a==null?'':a)===String(b==null?'':b);
}
function cvClone(o){return JSON.parse(JSON.stringify(o))}
function cvNextId(list){var m=2000;(list||[]).forEach(function(c){var n=parseInt(c&&c.id,10);if(n>m)m=n});return m+1}
function cvApplyOp(list,op){
  var arr=(list||[]).map(cvClone);
  if(op.type==='add'){var g=cvClone(op.guest);g.id=cvNextId(arr);arr.push(g);return {ok:true,list:arr}}
  var i=-1;for(var k=0;k<arr.length;k++)if(String(arr[k].id)===String(op.id)){i=k;break}
  if(op.type==='del'){if(i>=0)arr.splice(i,1);return {ok:true,list:arr}}
  if(i<0)return {ok:false,list:arr};
  var base=arr[i];Object.keys(op.patch||{}).forEach(function(key){base[key]=op.patch[key]});
  return {ok:true,list:arr};
}
function cvBuildPatch(draft,base){
  var patch={};
  function put(k,now){if(!base||!cvSame(base[k],now))patch[k]=now}
  put('nome',draft.nome);put('conjuge',draft.conjuge);put('nivel',draft.nivel);put('via',draft.via||'');
  if(!base||cvQtd(base)!==draft.qtd)patch.qtd=draft.qtd;
  if(!base||!!base.padrinho!==!!draft.padrinho)patch.padrinho=!!draft.padrinho;
  if(!base||cvUi(base)!==draft.ui){
    var st=cvStatusPatch(draft.ui);
    Object.keys(st).forEach(function(k){patch[k]=st[k]});
    if(base&&Object.prototype.hasOwnProperty.call(base,'envio')&&Object.prototype.hasOwnProperty.call(st,'enviado'))patch.envio=st.enviado;
  }
  return patch;
}
function cvFold(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function cvMatch(c){
  if(CV.nivel!=='todos'&&c.nivel!==CV.nivel)return false;
  if(CV.via&&c.via!==CV.via)return false;
  if(CV.st&&cvUi(c)!==CV.st)return false;
  var qq=cvFold(CV.q).trim();
  if(qq&&cvFold((c.nome||'')+' '+(c.conjuge||'')).indexOf(qq)<0)return false;
  return true;
}
function cvStats(list){
  var by={};CV_NIVEL.forEach(function(n){by[n[0]]={conv:0,pess:0}});
  var ui={aenviar:0,enviado:0,confirmado:0,recusado:0},via={fisico:0,online:0},padrinhos=0,pessoas=0;
  (list||[]).forEach(function(c){
    var qq=cvQtd(c);pessoas+=qq;if(c.padrinho)padrinhos++;
    if(by[c.nivel]){by[c.nivel].conv++;by[c.nivel].pess+=qq}
    ui[cvUi(c)]++;
    if(c.via==='fisico'||c.via==='online')via[c.via]++;
  });
  return {n:(list||[]).length,pessoas:pessoas,padrinhos:padrinhos,by:by,ui:ui,via:via,
    certeza:by.obrigatorio.pess,
    todos:by.obrigatorio.pess+by.queremos.pess+by.secouber.pess+by.pensar.pess};
}

function cvReadRow(){

    if(r.error)throw new Error(r.error.message);

function cvWrite(list,seen){
  var ts=new Date().toISOString();
  return sb.from('casamento_state').update({value:list,updated_at:ts}).eq('lista_id',CV.listaId).eq('key','convidados').eq('updated_at',seen).select('updated_at').then(function(up){
    if(up.error)throw new Error(up.error.message);
    if(up.data&&up.data.length)return {ok:true,ts:up.data[0].updated_at||ts};
    return cvReadRow().then(function(row){
      if((row.updated_at||'')===(seen||'')){
        return sb.from('casamento_state').upsert({lista_id:CV.listaId,key:'convidados',value:list,updated_at:ts}).select('updated_at').then(function(u2){
          if(u2.error)throw new Error(u2.error.message);
          return {ok:true,ts:(u2.data&&u2.data[0]&&u2.data[0].updated_at)||ts};
        });
      }
      return {ok:false,fresh:row};
    });
  });
}
function cvCommit(op){
  if(CV.busy||!sb||!CV.listaId)return Promise.resolve();
  CV.busy=true;var merged=false;
  function once(row){
    var applied=cvApplyOp(row.value,op);
    if(!applied.ok)return Promise.resolve({missing:true,fresh:row});
    if((row.updated_at||'')!==(CV.updatedAt||''))merged=true;
    return cvWrite(applied.list,row.updated_at).then(function(w){
      if(w.ok)return {list:applied.list,ts:w.ts,merged:merged};
      merged=true;
      var applied2=cvApplyOp(w.fresh.value,op);
      if(!applied2.ok)return {missing:true,fresh:w.fresh};
      return cvWrite(applied2.list,w.fresh.updated_at).then(function(w2){
        if(!w2.ok)return {warn:true,fresh:w2.fresh};
        return {list:applied2.list,ts:w2.ts,merged:true};
      });
    });
  }
  return cvReadRow().then(once).then(function(res){
    CV.busy=false;
    if(res.missing||res.warn){
      if(res.fresh){CV.list=res.fresh.value||[];CV.updatedAt=res.fresh.updated_at||''}
      CV.note='Esse convite mudou em outro aparelho. Atualizei a lista.';
      closeSheet();render();return;
    }
    CV.list=res.list;CV.updatedAt=res.ts;
    CV.note=res.merged?'Havia outra alteração. Juntei com a sua.':'';
    closeSheet();render();
  }).catch(function(err){
    CV.busy=false;
    CV.note='Não salvou: '+((err&&err.message)||'erro');
    var box=document.getElementById('cvsaveerr');
    if(box)box.textContent=CV.note;else render();
  });
}

  var levels=CV_NIVEL.filter(function(n){return n[0]!=='pensar'||S.by.pensar.conv});
  var chips='<button class="chip'+(CV.nivel==='todos'?' on':'')+'" onclick="cvFilt(\'nivel\',\'todos\')">Todos</button>'
    +levels.map(function(n){return '<button class="chip'+(CV.nivel===n[0]?' on':'')+'" onclick="cvFilt(\'nivel\','+q(n[0])+')">'+e(n[1])+'</button>'}).join('');
  function selOpt(val,lab,cur){return '<option value="'+e(val)+'"'+(cur===val?' selected':'')+'>'+e(lab)+'</option>'}
  var viaSel='<select class="chip'+(CV.via?' on':'')+'" onchange="cvFilt(\'via\',this.value)">'+selOpt('','Convite ▾',CV.via)+selOpt('fisico','Pessoalmente',CV.via)+selOpt('online','WhatsApp',CV.via)+'</select>';
  var stSel='<select class="chip'+(CV.st?' on':'')+'" onchange="cvFilt(\'st\',this.value)">'+selOpt('','Status ▾',CV.st)+CV_UI.map(function(x){return selOpt(x[0],x[1],CV.st)}).join('')+'</select>';
  var groups=CV_NIVEL.map(function(n){
    var g=CV.list.filter(function(c){return c.nivel===n[0]&&cvMatch(c)});
    if(!g.length)return '';
    var pess=g.reduce(function(s,c){return s+cvQtd(c)},0);
    var open=CV.more[n[0]]||g.length<=CV_PREVIEW;
    var shown=open?g:g.slice(0,CV_PREVIEW);
    var hidden=g.slice(shown.length);
    var hp=hidden.reduce(function(s,c){return s+cvQtd(c)},0);
    var body=shown.map(function(c){
      var sub=cvSub(c);
      return '<div class="li tap" onclick="cvEdit('+q(String(c.id))+')"><div class="row" style="align-items:center"><div style="display:flex;gap:10px;align-items:center;min-width:0"><div class="cvn">'+cvNum(cvQtd(c))+'</div><div style="min-width:0"><div class="b">'+e(c.nome||'Sem nome')+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div></div><div class="cvside">'+cvViaIcon(c.via)+(c.padrinho?cvPadIcon():'')+cvPill(cvUi(c))+'</div></div></div>';
    }).join('');
    var more=hidden.length?'<div class="sub tap" style="margin-top:8px;color:'+AC+';font-weight:600" onclick="cvMore('+q(n[0])+')">Ver mais '+hp+(hp===1?' pessoa':' pessoas')+' ›</div>':'';
    return '<div class="card"><h3>'+e(n[1])+' · '+pess+(pess===1?' pessoa':' pessoas')+'</h3>'+body+more+'</div>';
  }).join('');
  if(!groups)groups='<div class="card full"><div class="sub empty">Nenhum convite</div></div>';
  return head('Convidados')
    +(CV.note?'<div class="full banner">'+e(CV.note)+'</div>':'')
    +'<div class="card"><h3>Pessoas</h3><div class="row" style="align-items:flex-end"><div><div class="big">'+S.certeza+'</div><div class="sub">com certeza · '+S.by.obrigatorio.conv+' convites</div></div><div style="text-align:right"><div class="sub">Se todos vierem</div><div class="h" style="font-size:28px;font-weight:600;color:'+AC+'">'+S.todos+'</div></div></div>'+rows+'</div>'
    +'<div class="card"><h3>Convite</h3><div class="big">'+S.n+'</div><div class="sub">convites · '+S.padrinhos+(S.padrinhos===1?' padrinho':' padrinhos')+'</div>'
    +'<div class="cd"><div><b>'+S.via.fisico+'</b><span>'+cvViaIcon('fisico')+'</span></div><div><b>'+S.via.online+'</b><span>'+cvViaIcon('online')+'</span></div><div><b>'+S.ui.aenviar+'</b><span>A enviar</span></div></div></div>'
    +'<div class="full" style="display:flex;gap:8px;align-items:center"><div class="search" style="flex:1"><input id="cvq" placeholder="Buscar nome ou cônjuge" value="'+e(CV.q)+'" oninput="cvFind(this.value)"></div><button class="addb" onclick="cvNew()" aria-label="Adicionar convite">+</button></div>'
    +'<div class="full" style="display:flex;gap:8px;flex-wrap:wrap">'+chips+'</div>'
    +'<div class="full" style="display:flex;gap:8px;flex-wrap:wrap">'+viaSel+stSel+'</div>'
    +groups;
}
function cvSyncInputs(){
  if(!CV.draft)return;
  var n=document.getElementById('cvNome'),c=document.getElementById('cvConj');
  if(n)CV.draft.nome=n.value;if(c)CV.draft.conjuge=c.value;
}
function cvPaint(){cvSyncInputs();var s=document.getElementById('sh');s.innerHTML=cvFormHtml();s.scrollTop=0;s.classList.add('open');document.getElementById('ov').style.display='block'}
function cvFormHtml(){
  var d=CV.draft,novo=!d.id;
  function chip(arr,key){return arr.map(function(x){return '<button type="button" class="chip'+(d[key]===x[0]?' on':'')+'" onclick="cvSet('+q(key)+','+q(x[0])+')">'+e(x[1])+'</button>'}).join('')}
  return '<div class="grab"></div><div class="row"><div><div class="kick">'+(novo?'Novo convite':'Editar convite')+'</div><div class="h" style="font-size:32px;font-weight:600;font-style:italic">'+(novo?'Novo convite':e(d.nome||'Sem nome'))+'</div></div><div class="x" onclick="closeSheet()">✕</div></div>'
    +'<div class="flab">Nome</div><input class="fld" id="cvNome" value="'+e(d.nome)+'">'
    +'<div class="flab">Cônjuge / acompanhante</div><input class="fld" id="cvConj" value="'+e(d.conjuge)+'">'
    +'<div class="flab">Nível</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+chip(CV_NIVEL,'nivel')+'</div>'
    +'<div class="row" style="align-items:flex-end;margin-top:4px"><div><div class="flab">Pessoas</div><div class="step"><button type="button" onclick="cvStep(-1)" aria-label="Menos uma pessoa">−</button><b>'+d.qtd+'</b><button type="button" onclick="cvStep(1)" aria-label="Mais uma pessoa">+</button></div></div>'
    +'<div style="text-align:right"><div class="flab">Padrinho</div><button type="button" class="swi'+(d.padrinho?' on':'')+'" onclick="cvPad()" aria-pressed="'+(d.padrinho?'true':'false')+'" aria-label="Padrinho"><i></i></button></div></div>'
    +'<div class="flab">Forma de convite</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+chip(CV_VIA,'via')+'</div>'
    +'<div class="flab">Status</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+chip(CV_UI,'ui')+'</div>'
    +'<button type="button" class="btn-gold" id="cvSaveBtn" onclick="cvSave()">Salvar</button>'
    +'<div class="sub" id="cvsaveerr" style="color:#C0392B;margin-top:8px"></div>'
    +(novo?'':('<button type="button" class="btn-del" onclick="cvAskDel()">Excluir convite</button>'
      +(CV.confirmDel?'<div class="card" style="margin-top:12px"><div class="b">Excluir este convite?</div><div class="sub" style="margin-top:4px">Remove o convite e as pessoas dele da lista. Não dá para desfazer.</div><div style="display:flex;gap:8px;margin-top:12px"><button type="button" class="btn-cancel" onclick="cvCancelDel()">Cancelar</button><button type="button" class="btn-excl" onclick="cvDoDel()">Excluir</button></div></div>':'')));
}
function cvNew(){CV.draft={id:null,nome:'',conjuge:'',nivel:'obrigatorio',qtd:1,padrinho:false,via:'',ui:'aenviar',base:null};CV.confirmDel=false;cvPaint()}
function cvEdit(id){
  var c=null;CV.list.forEach(function(x){if(String(x.id)===String(id))c=x});
  if(!c)return;
  CV.draft={id:c.id,nome:c.nome||'',conjuge:c.conjuge||'',nivel:CV_NIVEL.some(function(n){return n[0]===c.nivel})?c.nivel:'obrigatorio',qtd:cvQtd(c),padrinho:!!c.padrinho,via:(c.via==='fisico'||c.via==='online')?c.via:'',ui:cvUi(c),base:cvClone(c)};
  CV.confirmDel=false;cvPaint();
}
function cvSet(key,val){if(!CV.draft)return;cvSyncInputs();CV.draft[key]=val;cvPaint()}
function cvStep(d){if(!CV.draft)return;cvSyncInputs();CV.draft.qtd=Math.max(1,(parseInt(CV.draft.qtd,10)||1)+d);cvPaint()}
function cvPad(){if(!CV.draft)return;cvSyncInputs();CV.draft.padrinho=!CV.draft.padrinho;cvPaint()}
function cvAskDel(){CV.confirmDel=true;cvPaint()}
function cvCancelDel(){CV.confirmDel=false;cvPaint()}
function cvSave(){
  if(!CV.draft||CV.busy)return;
  cvSyncInputs();
  var d=CV.draft;
  d.nome=String(d.nome||'').trim();d.conjuge=String(d.conjuge||'').trim();
  if(!d.nome){var n=document.getElementById('cvNome');if(n)n.focus();return}
  if(!d.id){
    var guest={nome:d.nome,conjuge:d.conjuge,nivel:d.nivel,qtd:Math.max(1,parseInt(d.qtd,10)||1),padrinho:!!d.padrinho};
    if(d.via)guest.via=d.via;
    var st=cvStatusPatch(d.ui);Object.keys(st).forEach(function(k){guest[k]=st[k]});
    cvCommit({type:'add',guest:guest});return;
  }
  var patch=cvBuildPatch(d,d.base);
  if(!Object.keys(patch).length){closeSheet();return}
  cvCommit({type:'edit',id:d.id,patch:patch});
}
function cvDoDel(){if(!CV.draft||!CV.draft.id)return;cvCommit({type:'del',id:CV.draft.id})}
/* Pull-to-refresh: mesma lógica do apto (só no topo, puxão além do limite, spinner de vidro). */
function loadData(){return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
var PTR={on:0,y0:0,x0:0,dy:0,busy:0,noteT:0};
function ptrTop(){return (window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0)<=0}
function ptrIgnore(t){
  if(document.getElementById('sh').classList.contains('open'))return 1;
  if(!t||!t.closest)return 0;
  return t.closest('#sh,#ov,#tb,select,input,textarea,button,a')?1:0;
}
function ptrShow(px,busy){
  var el=document.getElementById('ptr');
  el.classList.toggle('drag',!busy);
  el.classList.toggle('busy',!!busy);
  el.style.transform='translateY('+(Math.min(16,px*0.42-34))+'px)';
  el.style.opacity=String(Math.max(0,Math.min(1,(px-4)/36)));
  var s=el.querySelector('.spin');
  if(busy)s.style.transform='';else s.style.transform='rotate('+(px*3)+'deg)';
}
function ptrHide(){
  var el=document.getElementById('ptr');
  el.classList.remove('drag','busy');
  el.style.transform='';el.style.opacity='';
  var s=el.querySelector('.spin');if(s)s.style.transform='';
  PTR.dy=0;
}
function ptrNote(){
  var d=new Date(),n=document.getElementById('ptr-note');
  n.textContent='Atualizado às '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  n.classList.add('show');
  clearTimeout(PTR.noteT);
  PTR.noteT=setTimeout(function(){n.classList.remove('show')},2400);
}
function ptrRefresh(){
  if(PTR.busy)return;
  PTR.busy=1;PTR.on=0;
  ptrShow(72,1);
  var job=TAB==='conv'?cvReload():loadData().then(function(d){D=d;render()});
  job.then(function(){ptrNote()}).catch(function(){}).then(function(){PTR.busy=0;ptrHide()});
}
document.addEventListener('touchstart',function(ev){
  if(PTR.busy||ev.touches.length!==1||!ptrTop()||ptrIgnore(ev.target)){PTR.on=0;return}
  PTR.on=1;PTR.y0=ev.touches[0].clientY;PTR.x0=ev.touches[0].clientX;PTR.dy=0;
},{passive:true});
document.addEventListener('touchmove',function(ev){
  if(!PTR.on||PTR.busy)return;
  var t=ev.touches[0],raw=t.clientY-PTR.y0,dx=t.clientX-PTR.x0;
  if(!ptrTop()||raw<8||Math.abs(dx)>Math.abs(raw)){if(raw<0||Math.abs(dx)>12){PTR.on=0;ptrHide()}return}
  PTR.dy=Math.min(110,(raw-8)*0.55);
  if(ev.cancelable)ev.preventDefault();
  ptrShow(PTR.dy,0);
},{passive:false});
document.addEventListener('touchend',function(){
  if(!PTR.on)return;
  PTR.on=0;
  if(PTR.dy>=58)ptrRefresh();else ptrHide();
});
document.addEventListener('touchcancel',function(){PTR.on=0;if(!PTR.busy)ptrHide()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeSheet()});
(function(){var u=new URLSearchParams(location.search);if(u.get('embed')==='1')document.body.classList.add('embed');if(u.get('tab'))TAB=u.get('tab');if(u.get('mes'))MES=u.get('mes');if(u.get('hoje')){var H=u.get('hoje');hoje=function(){return H}}
  loadData().then(function(d){D=d;render();if(TAB==='conv')cvBoot();if(u.get('sheet'))openSheet(u.get('sheet'))})
  .catch(function(err){document.getElementById('app').innerHTML='<div class="full card">Não consegui carregar data.json<br><span class="sub">'+e(err.message)+'</span></div>'})})();
</script></body></html>
