function cvApplyOp(list,op){
  var arr=(list||[]).map(cvClone);
  if(op.type==='add'){var g=cvClone(op.guest);g.id=cvNextId(arr);arr.push(g);return {ok:true,list:arr}}
  var i=-1;for(var k=0;k<arr.length;k++)if(String(arr[k].id)===String(op.id)){i=k;break}
  if(op.type==='del'){if(i>=0)arr.splice(i,1);return {ok:true,list:arr}}
  if(i<0)return {ok:false,list:arr};
  var base=arr[i];Object.keys(op.patch||{}).forEach(function(key){base[key]=op.patch[key]});
  return {ok:true,list:arr};
}
function cvBuildPatch(draft,base){
  var patch={};
  function put(k,now){if(!base||!cvSame(base[k],now))patch[k]=now}
  put('nome',draft.nome);put('conjuge',draft.conjuge);put('nivel',draft.nivel);put('via',draft.via||'');
  if(!base||cvQtd(base)!==draft.qtd)patch.qtd=draft.qtd;
  if(!base||!!base.padrinho!==!!draft.padrinho)patch.padrinho=!!draft.padrinho;
  if(!base||cvUi(base)!==draft.ui){
    var st=cvStatusPatch(draft.ui);
    Object.keys(st).forEach(function(k){patch[k]=st[k]});
    if(base&&Object.prototype.hasOwnProperty.call(base,'envio')&&Object.prototype.hasOwnProperty.call(st,'enviado'))patch.envio=st.enviado;
  }
  return patch;
}
function cvFold(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function cvMatch(c){
  if(CV.nivel!=='todos'&&c.nivel!==CV.nivel)return false;
  if(CV.via&&c.via!==CV.via)return false;
  if(CV.st&&cvUi(c)!==CV.st)return false;
  var qq=cvFold(CV.q).trim();
  if(qq&&cvFold((c.nome||'')+' '+(c.conjuge||'')).indexOf(qq)<0)return false;
  return true;
}
function cvStats(list){
  var by={};CV_NIVEL.forEach(function(n){by[n[0]]={conv:0,pess:0}});
  var ui={aenviar:0,enviado:0,confirmado:0,recusado:0},via={fisico:0,online:0},padrinhos=0,pessoas=0;
  (list||[]).forEach(function(c){
    var qq=cvQtd(c);pessoas+=qq;if(c.padrinho)padrinhos++;
    if(by[c.nivel]){by[c.nivel].conv++;by[c.nivel].pess+=qq}
    ui[cvUi(c)]++;
    if(c.via==='fisico'||c.via==='online')via[c.via]++;
  });
  return {n:(list||[]).length,pessoas:pessoas,padrinhos:padrinhos,by:by,ui:ui,via:via,
    certeza:by.obrigatorio.pess,
    todos:by.obrigatorio.pess+by.queremos.pess+by.secouber.pess+by.pensar.pess};
}
function cvLab(arr,k){for(var i=0;i<arr.length;i++)if(arr[i][0]===k)return arr[i][1];return k}

  var m=map[ui]||map.aenviar;
  return '<span class="pill" style="background:'+m[1]+';color:'+m[0]+'">'+e(cvLab(CV_UI,ui))+'</span>';
}

function sbClient(){
  if(sb)return sb;
  if(!(window.supabase&&window.supabase.createClient))return null;
  try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(err){sb=null;return null}
  sb.auth.onAuthStateChange(function(ev,sess){
    if(ev==='SIGNED_OUT'){CV.state='nologin';CV.list=[];CV.listaId='';CV.updatedAt='';CH.state='nologin';CH.msgs=[];CH.listaId='';if(CH.rt){try{sb.removeChannel(CH.rt)}catch(e){}CH.rt=null}if(TAB==='conv'||TAB==='chat')render();return}
    if(ev==='SIGNED_IN'&&sess){if(CV.state!=='ok'&&CV.state!=='loading')cvLoad();if(TAB==='chat')chLoad(true)}
  });
  return sb;
}
function cvBoot(){
  var client=sbClient();
  if(!client){CV.state='error';CV.err='Não carregou o conector.';if(TAB==='conv')render();return Promise.resolve()}
  CV.state='loading';if(TAB==='conv')render();
  return client.auth.getSession().then(function(r){
    var sess=r&&r.data&&r.data.session;
    if(!sess){CV.state='nologin';if(TAB==='conv')render();return}
    return cvLoad();
  }).catch(function(err){CV.state='error';CV.err=(err&&err.message)||'falha';if(TAB==='conv')render()});
}
function cvLoad(){
  var keep=CV.state==='ok';
  if(!keep){CV.state='loading';if(TAB==='conv')render()}
  return sb.from('listas').select('id').eq('tipo','casamento').then(function(lr){
    if(lr.error)throw new Error(lr.error.message);
    var alvo=(lr.data||[])[0];
    if(!alvo){CV.state='empty';if(TAB==='conv')render();return}
    CV.listaId=alvo.id;
    return sb.from('casamento_state').select('value,updated_at').eq('lista_id',alvo.id).eq('key','convidados').maybeSingle().then(function(r){
      if(r.error)throw new Error(r.error.message);
      CV.list=(r.data&&Array.isArray(r.data.value))?r.data.value:[];
      CV.updatedAt=r.data?(r.data.updated_at||''):'';
      CV.state='ok';
      if(TAB==='conv')render();
    });
  }).catch(function(err){
    if(keep){CV.note='Não atualizei: '+((err&&err.message)||'falha');if(TAB==='conv')render();throw err}
    CV.state='error';CV.err=(err&&err.message)||'falha';if(TAB==='conv')render();throw err;
  });
}
function cvReload(){
  if(!sbClient())return Promise.reject(new Error('sem conector'));
  if(CV.state==='nologin'||CV.state==='init'||CV.state==='error')return cvBoot().then(function(){if(CV.state==='error')throw new Error(CV.err||'falha')});
  return cvLoad();
}
function cvReadRow(){
  return sb.from('casamento_state').select('value,updated_at').eq('lista_id',CV.listaId).eq('key','convidados').maybeSingle().then(function(r){
    if(r.error)throw new Error(r.error.message);
    return {value:(r.data&&Array.isArray(r.data.value))?r.data.value:[],updated_at:r.data?(r.data.updated_at||''):''};
  });
}
function cvWrite(list,seen){
  var ts=new Date().toISOString();
  return sb.from('casamento_state').update({value:list,updated_at:ts}).eq('lista_id',CV.listaId).eq('key','convidados').eq('updated_at',seen).select('updated_at').then(function(up){
    if(up.error)throw new Error(up.error.message);
    if(up.data&&up.data.length)return {ok:true,ts:up.data[0].updated_at||ts};
    return cvReadRow().then(function(row){
      if((row.updated_at||'')===(seen||'')){
        return sb.from('casamento_state').upsert({lista_id:CV.listaId,key:'convidados',value:list,updated_at:ts}).select('updated_at').then(function(u2){
          if(u2.error)throw new Error(u2.error.message);
          return {ok:true,ts:(u2.data&&u2.data[0]&&u2.data[0].updated_at)||ts};
        });
      }
      return {ok:false,fresh:row};
    });
  });
}
function cvCommit(op){
  if(CV.busy||!sb||!CV.listaId)return Promise.resolve();
  CV.busy=true;var merged=false;
  function once(row){
    var applied=cvApplyOp(row.value,op);
    if(!applied.ok)return Promise.resolve({missing:true,fresh:row});
    if((row.updated_at||'')!==(CV.updatedAt||''))merged=true;
    return cvWrite(applied.list,row.updated_at).then(function(w){
      if(w.ok)return {list:applied.list,ts:w.ts,merged:merged};
      merged=true;
      var applied2=cvApplyOp(w.fresh.value,op);
      if(!applied2.ok)return {missing:true,fresh:w.fresh};
      return cvWrite(applied2.list,w.fresh.updated_at).then(function(w2){
        if(!w2.ok)return {warn:true,fresh:w2.fresh};
        return {list:applied2.list,ts:w2.ts,merged:true};
      });
    });
  }
  return cvReadRow().then(once).then(function(res){
    CV.busy=false;
    if(res.missing||res.warn){
      if(res.fresh){CV.list=res.fresh.value||[];CV.updatedAt=res.fresh.updated_at||''}
      CV.note='Esse convite mudou em outro aparelho. Atualizei a lista.';
      closeSheet();render();return;
    }
    CV.list=res.list;CV.updatedAt=res.ts;
    CV.note=res.merged?'Havia outra alteração. Juntei com a sua.':'';
    closeSheet();render();
  }).catch(function(err){
    CV.busy=false;
    CV.note='Não salvou: '+((err&&err.message)||'erro');
    var box=document.getElementById('cvsaveerr');
    if(box)box.textContent=CV.note;else render();
  });
}
function cvLogin(){
  var em=(document.getElementById('cvEmail').value||'').trim(),pw=document.getElementById('cvPass').value||'';
  if(!em||!pw){CV.err='Preencha e-mail e senha';render();return}
  var client=sbClient();if(!client){CV.err='Não carregou o conector.';render();return}
  CV.err='';CV.state='loading';render();
  client.auth.signInWithPassword({email:em,password:pw}).then(function(r){
    if(r.error){CV.state='nologin';CV.err=r.error.message;render();return}
    cvLoad();
  }).catch(function(err){CV.state='nologin';CV.err=(err&&err.message)||'falha';render()});
}

  cvSyncInputs();
  var d=CV.draft;
  d.nome=String(d.nome||'').trim();d.conjuge=String(d.conjuge||'').trim();
  if(!d.nome){var n=document.getElementById('cvNome');if(n)n.focus();return}

    var trash=CH.phase==='locked'?'<button type="button" class="chmic" aria-label="Cancelar gravação" onclick="chMicAbort()">'+chTrashSvg()+'</button>':'';

    return '<div class="chcompose"><div class="chrec"><span class="chdot"></span><span class="chtimer" id="chTimer">'+chClock()+'</span><span class="chwave" id="chWave">'+chBars()+'</span>'+hint+'</div>'+trash+side+'</div>';

function chSendText(){

function chTeardown(){if(CH.tick){clearInterval(CH.tick);CH.tick=0}if(CH.actx){try{CH.actx.close()}catch(err){}CH.actx=null;CH.an=null}}
function chArmMeters(){if(CH.tick)clearInterval(CH.tick);CH.tick=setInterval(function(){if(CH.phase!=='hold'&&CH.phase!=='locked'&&CH.phase!=='rec'){clearInterval(CH.tick);CH.tick=0;return}var el=document.getElementById('chTimer');if(el)el.textContent=chClock();chLevels()},90)}
function chLevels(){if(!CH.an||!CH.buf)return;CH.an.getByteTimeDomainData(CH.buf);var bars=document.querySelectorAll('#chWave i');if(!bars.length)return;var step=Math.max(1,Math.floor(CH.buf.length/bars.length));for(var i=0;i<bars.length;i++){var v=Math.abs(CH.buf[i*step]-128)/64;bars[i].style.height=Math.max(3,Math.min(22,Math.round(v*22)))+'px'}}
function chGraph(stream){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{if(!CH.actx)CH.actx=new AC();if(CH.actx.state==='suspended')CH.actx.resume();var src=CH.actx.createMediaStreamSource(stream);var an=CH.actx.createAnalyser();an.fftSize=64;src.connect(an);CH.an=an;CH.buf=new Uint8Array(an.fftSize)}catch(err){}}
function chMicStart(){
  if(CH.rec||CH.starting||!navigator.mediaDevices||!window.MediaRecorder){if(!CH.rec&&!CH.starting){CH.note='Este navegador não grava áudio.';render()}return}
  CH.starting=true;CH.transcript='';CH.discard=false;CH.wantPreview=false;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){try{var sr=new SR();sr.lang='pt-BR';sr.continuous=true;sr.interimResults=true;sr.onresult=function(ev){var t='';for(var i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;CH.transcript=t};sr.start();CH.sr=sr}catch(e){CH.sr=null}}
  var AC=window.AudioContext||window.webkitAudioContext;if(AC&&!CH.actx){try{CH.actx=new AC();CH.actx.resume()}catch(e){}}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(CH.discard){stream.getTracks().forEach(function(t){t.stop()});CH.starting=false;return}
    var mime=pickMime();
    var rec;try{rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){stream.getTracks().forEach(function(t){t.stop()});throw e}
    var chunks=[];
    rec.ondataavailable=function(ev){if(ev.data&&ev.data.size)chunks.push(ev.data)};
    rec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});
      chTeardown();
      var discard=CH.discard,preview=CH.wantPreview;
      CH.rec=null;CH.starting=false;
      if(discard){CH.discard=false;CH.wantPreview=false;CH.transcript='';CH.phase='';return}
      var blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});
      if(preview){
        if(CH.preview&&CH.preview.url)try{URL.revokeObjectURL(CH.preview.url)}catch(err){}
        CH.preview={url:URL.createObjectURL(blob),blob:blob,mime:blob.type,texto:(CH.transcript||'').trim()};
        CH.phase='preview';CH.wantPreview=false;render();return;
      }
      chUpload(blob,blob.type||mime);
    };
    rec.start(1000);chGraph(stream);CH.rec=rec;CH.recAt=CH.holdAt||Date.now();CH.starting=false;
    if(CH.mode==='tap'){CH.phase='rec';chBuzz();if(CH.intent==='send'){CH.intent='';gvStop();return}render();return}
    CH.phase=CH.phase==='locked'?'locked':'hold';chBuzz();
    if(CH.intent==='cancel'){CH.intent='';chMicAbort();return}
    if(CH.intent==='lock'){CH.intent='';chMicLock();return}
    if(CH.intent==='send'){CH.intent='';chMicFinish(false);return}
    render();
  }).catch(function(){CH.starting=false;CH.phase='';CH.note='Não consegui usar o microfone.';if(CH.sr){try{CH.sr.stop()}catch(e){}}CH.sr=null;render()});
}
function chUpload(blob,mime){
  var ext=chExt(mime);
  var path=CH.listaId+'/'+chUuid()+'.'+ext;
  var tipo=CH.tipoAt||'automatico';
  var dur=CH.durSec|0;
  var saved=false;
  CH.phase='';CH.busy=true;
  if(TAB==='chat')render();
  return sb.storage.from('casamento-audio').upload(path,blob,{contentType:mime||'audio/webm',upsert:false}).then(function(up){
    if(up.error)throw new Error(up.error.message);
    return chInsert({texto:gvTexto(tipo,dur),audio_path:path,tipo:tipo,duracao_s:dur});
  }).then(function(r){
    if(r.error)throw new Error(r.error.message);
    saved=true;
    CH.busy=false;
    return chLoad(true).then(function(){return chPing(false)});
  }).catch(function(err){
    CH.busy=false;
    if(!saved){CH.fails=CH.fails||[];CH.fails.unshift({id:'f'+Date.now(),tipo:tipo,dur:dur,blob:blob,mime:mime,at:new Date().toISOString()})}
    else gvToast((err&&err.message)||'Não atualizei a lista.','err');
    render();
  });
}
function chMicDown(ev){
  if(CH.gesture)return;
  if(ev&&ev.preventDefault)ev.preventDefault();
  if(CH.phase==='locked'||CH.phase==='preview')return;
  var p=chPoint(ev);
  CH.gesture='down';CH.x0=p.x;CH.y0=p.y;CH.dx=0;CH.dy=0;CH.holding=true;CH.holdAt=Date.now();CH.intent='';CH.pid=p.id;
  chListen();chMicStart();
}
function chMicMove(ev){
  if(CH.gesture!=='down'||CH.phase==='locked'||CH.phase==='preview')return;
  if(ev.cancelable)ev.preventDefault();
  var p=chPoint(ev);CH.dx=p.x-CH.x0;CH.dy=p.y-CH.y0;
  var g=chGesture(CH.dx,CH.dy);
  if(g==='cancel'){chMicAbort();return}
  if(g==='lock'){chMicLock();return}
  var hint=document.getElementById('chHint');if(hint)hint.style.opacity=String(Math.max(.3,1+CH.dx/140));
  var lock=document.getElementById('chLock');if(lock)lock.style.transform='translateY('+Math.max(CH.dy,-62)+'px)';
}
function chMicUp(ev){
  if(CH.gesture!=='down')return;
  CH.gesture='';CH.holding=false;chUnlisten();
  if(ev&&ev.clientX==null&&ev.changedTouches){var p=chPoint(ev);CH.dx=p.x-CH.x0;CH.dy=p.y-CH.y0}
  if(CH.phase==='locked'||CH.phase==='preview')return;
  var quick=Date.now()-CH.holdAt<320&&Math.abs(CH.dx)<28&&Math.abs(CH.dy)<28;
  if(!CH.rec){CH.intent=quick?'lock':'send';return}
  if(quick)chMicLock();else chMicFinish(false);
}
function chMicCancel(){if(CH.gesture!=='down')return;CH.gesture='';if(CH.phase==='hold')chMicAbort();else chUnlisten()}
function chMicLock(){if(CH.phase==='locked')return;CH.phase='locked';CH.holding=false;CH.gesture='';chUnlisten();render()}
function chMicFinish(preview){
  if(CH.phase!=='hold'&&CH.phase!=='locked'&&!CH.rec)return;
  CH.wantPreview=preview===true;CH.discard=false;chUnlisten();CH.gesture='';
  if(CH.sr){try{CH.sr.stop()}catch(e){}}CH.sr=null;
  if(CH.rec&&CH.rec.state!=='inactive'){try{CH.rec.stop()}catch(e){}}
  else render();
}
function chMicAbort(){
  CH.discard=true;CH.wantPreview=false;CH.phase='';CH.intent='';CH.holding=false;CH.gesture='';chBuzz();chUnlisten();
  if(CH.sr){try{CH.sr.stop()}catch(e){}}CH.sr=null;CH.transcript='';
  if(CH.rec&&CH.rec.state!=='inactive'){try{CH.rec.stop()}catch(e){CH.rec=null;chTeardown()}}
  else {CH.rec=null;chTeardown()}
  render();
}
function chPreviewDrop(){chBuzz();if(CH.preview&&CH.preview.url)try{URL.revokeObjectURL(CH.preview.url)}catch(err){}CH.preview=null;CH.phase='';CH.transcript='';render()}
function chPreviewSend(){if(!CH.preview||CH.busy)return;var p=CH.preview;chUpload(p.blob,p.mime,p.texto||'')}
function gvPingErr(j,status){return (j&&(j.erro||j.error||j.message))||('Erro '+status)}
function gvApplyPing(res,manual){
  if(!res)return Promise.resolve();
  if(res.status===401){CH.state='nologin';gvToast('Entre de novo para chamar o assistente.','err');return Promise.resolve()}
  return res.json().then(function(j){
    j=j||{};
    if(res.status===403||res.status===409||res.status===502||res.status===503){gvToast(String(gvPingErr(j,res.status)),'err');return}
    if(j.ok===true){gvMarkPing();gvToast('🥂 Assistente acionado ('+(j.pending!=null?j.pending:chPendingN())+' pendentes)','ok');return}
    if(j.skipped===true){if(manual)gvToast('Já acionado há pouco, aguarde '+(j.wait_s|0)+'s','err');return}
    if(j.erro||j.error)gvToast(String(j.erro||j.error),'err');
  }).catch(function(){if(res.status===403||res.status===502||res.status===503)gvToast('Erro '+res.status,'err')});
}
function chPing(manual,body){
  if(CH.pinging)return;
  if(!CH.listaId)return;
  var client=sbClient();if(!client){gvToast('Não carregou o conector.','err');return}
  var payload=body||{lista_id:CH.listaId,action:'ping'};
  CH.pinging=true;if(TAB==='chat')render();
  client.auth.getSession().then(function(r){
    var token=r&&r.data&&r.data.session&&r.data.session.access_token;
    if(!token){CH.state='nologin';gvToast('Entre de novo para chamar o assistente.','err');return null}
    return fetch(SB_URL+'/functions/v1/casamento-chat-ping',{method:'POST',headers:{'Authorization':'Bearer '+token,'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});
  }).then(function(res){return gvApplyPing(res,manual===true)}).catch(function(){gvToast('Sem conexão com o assistente.','err')}).finally(function(){CH.pinging=false;if(TAB==='chat'){chLoad(true)}});
}
/* Pull-to-refresh: mesma lógica do apto (só no topo, puxão além do limite, spinner de vidro). */
function loadData(){return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
var PTR={on:0,y0:0,x0:0,dy:0,busy:0,noteT:0};
function ptrTop(){return (window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0)<=0}
function ptrIgnore(t){
  if(document.getElementById('sh').classList.contains('open'))return 1;
  if(window.CH&&(CH.phase==='hold'||CH.phase==='locked'||CH.phase==='preview'||CH.phase==='rec'))return 1;
  if(!t||!t.closest)return 0;
  return t.closest('#sh,#ov,#tb,select,input,textarea,button,a')?1:0;
}
function ptrShow(px,busy){
  var el=document.getElementById('ptr');
  el.classList.toggle('drag',!busy);
  el.classList.toggle('busy',!!busy);
  el.style.transform='translateY('+(Math.min(16,px*0.42-34))+'px)';
  el.style.opacity=String(Math.max(0,Math.min(1,(px-4)/36)));
  var s=el.querySelector('.spin');
  if(busy)s.style.transform='';else s.style.transform='rotate('+(px*3)+'deg)';
}
function ptrHide(){
  var el=document.getElementById('ptr');
  el.classList.remove('drag','busy');
  el.style.transform='';el.style.opacity='';
  var s=el.querySelector('.spin');if(s)s.style.transform='';
  PTR.dy=0;
}
function ptrNote(){
  var d=new Date(),n=document.getElementById('ptr-note');
  n.textContent='Atualizado às '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  n.classList.add('show');
  clearTimeout(PTR.noteT);
  PTR.noteT=setTimeout(function(){n.classList.remove('show')},2400);
}
function ptrRefresh(){
  if(PTR.busy)return;
  PTR.busy=1;PTR.on=0;
  ptrShow(72,1);
  verCheck();
  var job=TAB==='conv'?cvReload():TAB==='chat'?chReload():loadData().then(function(d){D=d;render()});
  job.then(function(){ptrNote()}).catch(function(){}).then(function(){PTR.busy=0;ptrHide()});
}
function verShow(){var el=document.getElementById('ver-toast');if(el)el.classList.add('show')}
function verCheck(){
  return fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)return null;return r.json()}).then(function(j){
    if(j&&j.v!=null&&String(j.v)!==String(APP_VERSION))verShow();
  }).catch(function(){});
}
function verReload(){
  var go=function(){location.replace(location.pathname+'?v='+Date.now()+location.hash)};
  var jobs=[];
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
    jobs.push(navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(function(r){if((r.scope||'').indexOf('/casamento')>=0)return r.unregister()}));
    }).catch(function(){}));
  }
  if(window.caches){
    jobs.push(caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){if(k.indexOf('casamento')>=0)return caches.delete(k)}));
    }).catch(function(){}));
  }
  Promise.all(jobs).then(go,go);
}
document.addEventListener('touchstart',function(ev){
  if(PTR.busy||ev.touches.length!==1||!ptrTop()||ptrIgnore(ev.target)){PTR.on=0;return}
  PTR.on=1;PTR.y0=ev.touches[0].clientY;PTR.x0=ev.touches[0].clientX;PTR.dy=0;
},{passive:true});
document.addEventListener('touchmove',function(ev){
  if(!PTR.on||PTR.busy)return;
  var t=ev.touches[0],raw=t.clientY-PTR.y0,dx=t.clientX-PTR.x0;
  if(!ptrTop()||raw<8||Math.abs(dx)>Math.abs(raw)){if(raw<0||Math.abs(dx)>12){PTR.on=0;ptrHide()}return}
  PTR.dy=Math.min(110,(raw-8)*0.55);
  if(ev.cancelable)ev.preventDefault();
  ptrShow(PTR.dy,0);
},{passive:false});
document.addEventListener('touchend',function(){
  if(!PTR.on)return;
  PTR.on=0;
  if(PTR.dy>=58)ptrRefresh();else ptrHide();
});
document.addEventListener('touchcancel',function(){PTR.on=0;if(!PTR.busy)ptrHide()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeSheet()});
(function(){var u=new URLSearchParams(location.search);if(u.get('embed')==='1')document.body.classList.add('embed');if(u.get('tab'))TAB=u.get('tab');if(TAB==='mes'){TAB='gastos';SUB.gastos='mes';subSave()}if(u.get('mes'))MES=u.get('mes');if(u.get('hoje')){var H=u.get('hoje');hoje=function(){return H}}
  verCheck();

  loadData().then(function(d){D=d;render();if(TAB==='conv')cvBoot();if(TAB==='chat')chOpen();if(u.get('sheet'))openSheet(u.get('sheet'))})
  .catch(function(err){document.getElementById('app').innerHTML='<div class="full card">Não consegui carregar data.json<br><span class="sub">'+e(err.message)+'</span></div>'})})();
