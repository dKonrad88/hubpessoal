  if(!client){CV.state='error';CV.err='Não carregou o conector.';if(TAB==='conv')render();return Promise.resolve()}
  CV.state='loading';if(TAB==='conv')render();
  return client.auth.getSession().then(function(r){
    var sess=r&&r.data&&r.data.session;
    if(!sess){CV.state='nologin';if(TAB==='conv')render();return}
    return cvLoad();
  }).catch(function(err){CV.state='error';CV.err=(err&&err.message)||'falha';if(TAB==='conv')render()});
}
function cvLoad(){
  var keep=CV.state==='ok';
  if(!keep){CV.state='loading';if(TAB==='conv')render()}
  return sb.from('listas').select('id').eq('tipo','casamento').then(function(lr){
    if(lr.error)throw new Error(lr.error.message);
    var alvo=(lr.data||[])[0];
    if(!alvo){CV.state='empty';if(TAB==='conv')render();return}
    CV.listaId=alvo.id;
    return sb.from('casamento_state').select('value,updated_at').eq('lista_id',alvo.id).eq('key','convidados').maybeSingle().then(function(r){
      if(r.error)throw new Error(r.error.message);
      CV.list=(r.data&&Array.isArray(r.data.value))?r.data.value:[];
      CV.updatedAt=r.data?(r.data.updated_at||''):'';
      CV.state='ok';
      if(TAB==='conv')render();
    });
  }).catch(function(err){
    if(keep){CV.note='Não atualizei: '+((err&&err.message)||'falha');if(TAB==='conv')render();throw err}
    CV.state='error';CV.err=(err&&err.message)||'falha';if(TAB==='conv')render();throw err;
  });
}
function cvReload(){
  if(!sbClient())return Promise.reject(new Error('sem conector'));
  if(CV.state==='nologin'||CV.state==='init'||CV.state==='error')return cvBoot().then(function(){if(CV.state==='error')throw new Error(CV.err||'falha')});
  return cvLoad();
}
function cvReadRow(){
  return sb.from('casamento_state').select('value,updated_at').eq('lista_id',CV.listaId).eq('key','convidados').maybeSingle().then(function(r){
    if(r.error)throw new Error(r.error.message);
    return {value:(r.data&&Array.isArray(r.data.value))?r.data.value:[],updated_at:r.data?(r.data.updated_at||''):''};
  });
}
function cvWrite(list,seen){
  var ts=new Date().toISOString();
  return sb.from('casamento_state').update({value:list,updated_at:ts}).eq('lista_id',CV.listaId).eq('key','convidados').eq('updated_at',seen).select('updated_at').then(function(up){
    if(up.error)throw new Error(up.error.message);
    if(up.data&&up.data.length)return {ok:true,ts:up.data[0].updated_at||ts};
    return cvReadRow().then(function(row){
      if((row.updated_at||'')===(seen||'')){
        return sb.from('casamento_state').upsert({lista_id:CV.listaId,key:'convidados',value:list,updated_at:ts}).select('updated_at').then(function(u2){
          if(u2.error)throw new Error(u2.error.message);
          return {ok:true,ts:(u2.data&&u2.data[0]&&u2.data[0].updated_at)||ts};
        });
      }
      return {ok:false,fresh:row};
    });
  });
}
function cvCommit(op){
  if(CV.busy||!sb||!CV.listaId)return Promise.resolve();
  CV.busy=true;var merged=false;
  function once(row){
    var applied=cvApplyOp(row.value,op);
    if(!applied.ok)return Promise.resolve({missing:true,fresh:row});
    if((row.updated_at||'')!==(CV.updatedAt||''))merged=true;
    return cvWrite(applied.list,row.updated_at).then(function(w){
      if(w.ok)return {list:applied.list,ts:w.ts,merged:merged};
      merged=true;
      var applied2=cvApplyOp(w.fresh.value,op);
      if(!applied2.ok)return {missing:true,fresh:w.fresh};
      return cvWrite(applied2.list,w.fresh.updated_at).then(function(w2){
        if(!w2.ok)return {warn:true,fresh:w2.fresh};
        return {list:applied2.list,ts:w2.ts,merged:true};
      });
    });
  }
  return cvReadRow().then(once).then(function(res){
    CV.busy=false;
    if(res.missing||res.warn){
      if(res.fresh){CV.list=res.fresh.value||[];CV.updatedAt=res.fresh.updated_at||''}
      CV.note='Esse convite mudou em outro aparelho. Atualizei a lista.';
      closeSheet();render();return;
    }
    CV.list=res.list;CV.updatedAt=res.ts;
    CV.note=res.merged?'Havia outra alteração. Juntei com a sua.':'';
    closeSheet();render();
  }).catch(function(err){
    CV.busy=false;
    CV.note='Não salvou: '+((err&&err.message)||'erro');
    var box=document.getElementById('cvsaveerr');
    if(box)box.textContent=CV.note;else render();
  });
}
function cvLogin(){
  var em=(document.getElementById('cvEmail').value||'').trim(),pw=document.getElementById('cvPass').value||'';
  if(!em||!pw){CV.err='Preencha e-mail e senha';render();return}
  var client=sbClient();if(!client){CV.err='Não carregou o conector.';render();return}
  CV.err='';CV.state='loading';render();
  client.auth.signInWithPassword({email:em,password:pw}).then(function(r){
    if(r.error){CV.state='nologin';CV.err=r.error.message;render();return}
    cvLoad();
  }).catch(function(err){CV.state='nologin';CV.err=(err&&err.message)||'falha';render()});
}

function cvNew(){CV.draft={id:null,nome:'',conjuge:'',nivel:'obrigatorio',qtd:1,padrinho:false,via:'',ui:'aenviar',base:null};CV.confirmDel=false;cvPaint()}
function cvEdit(id){
  var c=null;CV.list.forEach(function(x){if(String(x.id)===String(id))c=x});
  if(!c)return;
  CV.draft={id:c.id,nome:c.nome||'',conjuge:c.conjuge||'',nivel:CV_NIVEL.some(function(n){return n[0]===c.nivel})?c.nivel:'obrigatorio',qtd:cvQtd(c),padrinho:!!c.padrinho,via:(c.via==='fisico'||c.via==='online')?c.via:'',ui:cvUi(c),base:cvClone(c)};
  CV.confirmDel=false;cvPaint();
}
function cvSet(key,val){if(!CV.draft)return;cvSyncInputs();CV.draft[key]=val;cvPaint()}
function cvStep(d){if(!CV.draft)return;cvSyncInputs();CV.draft.qtd=Math.max(1,(parseInt(CV.draft.qtd,10)||1)+d);cvPaint()}
function cvPad(){if(!CV.draft)return;cvSyncInputs();CV.draft.padrinho=!CV.draft.padrinho;cvPaint()}
function cvAskDel(){CV.confirmDel=true;cvPaint()}
function cvCancelDel(){CV.confirmDel=false;cvPaint()}
function cvSave(){
  if(!CV.draft||CV.busy)return;
  cvSyncInputs();
  var d=CV.draft;
  d.nome=String(d.nome||'').trim();d.conjuge=String(d.conjuge||'').trim();
  if(!d.nome){var n=document.getElementById('cvNome');if(n)n.focus();return}
  if(!d.id){
    var guest={nome:d.nome,conjuge:d.conjuge,nivel:d.nivel,qtd:Math.max(1,parseInt(d.qtd,10)||1),padrinho:!!d.padrinho};
    if(d.via)guest.via=d.via;
    var st=cvStatusPatch(d.ui);Object.keys(st).forEach(function(k){guest[k]=st[k]});
    cvCommit({type:'add',guest:guest});return;
  }
  var patch=cvBuildPatch(d,d.base);
  if(!Object.keys(patch).length){closeSheet();return}
  cvCommit({type:'edit',id:d.id,patch:patch});
}
function cvDoDel(){if(!CV.draft||!CV.draft.id)return;cvCommit({type:'del',id:CV.draft.id})}

var CH={state:'init',err:'',note:'',msgs:[],urls:{},listaId:'',email:'',uid:'',draft:'',busy:false,rec:null,recAt:0,transcript:'',rt:null,askId:''};
function chNome(email){var em=String(email||'').toLowerCase();if(em==='konraddiego@gmail.com')return 'Diego';if(em==='debiandrade8@gmail.com')return 'Débora';return email||''}
function chWhen(iso){var d=new Date(iso);if(isNaN(d.getTime()))return '';return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function chExt(mime){mime=String(mime||'');if(mime.indexOf('mp4')>=0||mime.indexOf('aac')>=0||mime.indexOf('m4a')>=0)return 'mp4';if(mime.indexOf('ogg')>=0)return 'ogg';return 'webm'}
function chMime(){var types=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg','audio/mp4','audio/aac'];if(!(window.MediaRecorder&&MediaRecorder.isTypeSupported))return '';for(var i=0;i<types.length;i++)if(MediaRecorder.isTypeSupported(types[i]))return types[i];return ''}
function chUuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16)})}
function chPingMsg(status){if(status===200)return 'Enviado, respondo em instantes';if(status===503)return 'Mensagem salva; será lida às 20h';return 'Não consegui chamar o assistente.'}
function chMicSvg(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3M9 20h6"/></svg>'}
function chWatch(){if(!sb||!CH.listaId||CH.rt||!sb.channel)return;CH.rt=sb.channel('cas-chat-'+CH.listaId).on('postgres_changes',{event:'*',schema:'public',table:'casamento_chat',filter:'lista_id=eq.'+CH.listaId},function(){if(TAB==='chat'&&!CH.rec)chLoad(true)}).subscribe()}
function chLoad(quiet){
  var client=sbClient();
  if(!client){CH.state='error';CH.err='Não carregou o conector.';if(TAB==='chat')render();return Promise.reject(new Error('sem conector'))}
  return client.auth.getSession().then(function(r){
    var sess=r&&r.data&&r.data.session;
    if(!sess){CH.state='nologin';if(TAB==='chat')render();return}
    CH.email=(sess.user&&sess.user.email)||'';
    CH.uid=(sess.user&&sess.user.id)||'';
    if(!quiet){CH.state='loading';if(TAB==='chat')render()}
    var listaP=CH.listaId?Promise.resolve(CH.listaId):sb.from('listas').select('id').eq('tipo','casamento').then(function(lr){
      if(lr.error)throw new Error(lr.error.message);
      var alvo=(lr.data||[])[0];
      if(!alvo){CH.state='empty';if(TAB==='chat')render();return null}
      return alvo.id;
    });
    return listaP.then(function(id){
      if(!id)return;
      CH.listaId=id;
      return sb.from('casamento_chat').select('id,autor_id,autor_nome,papel,texto,audio_path,created_at,processado').eq('lista_id',id).order('created_at',{ascending:true}).then(function(q){
        if(q.error)throw new Error(q.error.message);
        CH.msgs=q.data||[];
        var paths=CH.msgs.map(function(m){return m.audio_path}).filter(Boolean);
        var sign=paths.length?sb.storage.from('casamento-audio').createSignedUrls(paths,3600):Promise.resolve({data:[]});
        return Promise.resolve(sign).then(function(s){
          CH.urls={};(s&&s.data||[]).forEach(function(x){if(x&&x.signedUrl)CH.urls[x.path]=x.signedUrl});
          CH.state='ok';chWatch();if(TAB==='chat'&&!CH.rec)render();
        });
      });
    });
  }).catch(function(err){
    if(quiet&&CH.state==='ok'){CH.note='Não atualizei o chat.';if(TAB==='chat')render();throw err}
    CH.state='error';CH.err=(err&&err.message)||'falha';if(TAB==='chat')render();throw err;
  });
}
function chOpen(){if(CH.state==='ok')chLoad(true);else chLoad(false)}
function chReload(){return chLoad(CH.state==='ok')}
function chLogin(){
  var em=(document.getElementById('chEmail').value||'').trim(),pw=document.getElementById('chPass').value||'';
  if(!em||!pw){CH.err='Preencha e-mail e senha';render();return}
  var client=sbClient();if(!client){CH.err='Não carregou o conector.';render();return}
  CH.err='';CH.state='loading';render();
  client.auth.signInWithPassword({email:em,password:pw}).then(function(r){
    if(r.error){CH.state='nologin';CH.err=r.error.message;render();return}
    CH.email=em;chLoad(false);
  }).catch(function(err){CH.state='nologin';CH.err=(err&&err.message)||'falha';render()});
}
function chMine(m){return !!(m&&m.papel==='user'&&!m.processado&&CH.uid&&String(m.autor_id)===String(CH.uid))}
function chHoldStart(id,ev){if(ev&&ev.target&&ev.target.closest&&ev.target.closest('button,audio'))return;CH.hx=ev.clientX;CH.hy=ev.clientY;clearTimeout(CH.holdT);CH.holdT=setTimeout(function(){CH.holdT=0;chAskDel(id)},520)}
function chHoldMove(ev){if(!CH.holdT)return;if(Math.abs(ev.clientX-CH.hx)>8||Math.abs(ev.clientY-CH.hy)>8)chHoldEnd()}
function chHoldEnd(){clearTimeout(CH.holdT);CH.holdT=0}
function chAskDel(id){chHoldEnd();CH.askId=String(id);render()}
function chAskCancel(){CH.askId='';render()}
function chDel(id){
  var m=null;CH.msgs.forEach(function(x){if(String(x.id)===String(id))m=x});
  if(!chMine(m)){CH.note='Não foi possível apagar';CH.askId='';render();return}
  var gone=m.audio_path?sb.storage.from('casamento-audio').remove([m.audio_path]):Promise.resolve({error:null});
  return gone.then(function(rm){
    if(rm&&rm.error)throw rm.error;
    return sb.from('casamento_chat').delete().eq('id',id).select('id');
  }).then(function(r){
    if(r.error||!r.data||!r.data.length)throw r.error||new Error('perm');

function chFold(s){return String(s||'').toLowerCase().replace(/á|à|â|ã/g,'a').replace(/é|ê/g,'e').replace(/í/g,'i').replace(/ó|ô|õ/g,'o').replace(/ú/g,'u')}

function chWaveGold(){var hs=[5,11,7,15,9,17,8,13,6,14,10,7],s='';for(var i=0;i<hs.length;i++)s+='<i style="height:'+hs[i]+'px"></i>';return s}

function chAudioEnd(a){

function chBubble(m){

function vChat(){
  if(CH.state==='loading'||CH.state==='init')return head('Chat')+'<div class="card full sub">Carregando a conversa…</div>';
  if(CH.state==='error')return head('Chat')+'<div class="card full"><h3>Não consegui carregar</h3><div class="sub">'+e(CH.err)+'</div><button class="btn-gold" type="button" onclick="chOpen()">Tentar de novo</button></div>';

function chBars(){var s='';for(var i=0;i<12;i++)s+='<i></i>';return s}
function chCompose(){
  if(CH.phase==='hold'||CH.phase==='locked'){
    var hint=CH.phase==='locked'?'':'<span class="chhint" id="chHint">‹ deslize para cancelar</span>';
    var trash=CH.phase==='locked'?'<button type="button" class="chmic" aria-label="Cancelar gravação" onclick="chMicAbort()">'+chTrashSvg()+'</button>':'';
    var side=CH.phase==='locked'?'<button type="button" class="chmic" aria-label="Parar" onclick="chMicFinish(true)">'+chStopSvg()+'</button>':'<button type="button" class="chmic on" id="chMic" aria-label="Gravar áudio" onpointerdown="chMicDown(event)" ontouchstart="chMicDown(event)">'+chMicSvg()+'<span class="chlock" id="chLock">'+chLockSvg(false)+'</span></button>';
    return '<div class="chcompose"><div class="chrec"><span class="chdot"></span><span class="chtimer" id="chTimer">'+chClock()+'</span><span class="chwave" id="chWave">'+chBars()+'</span>'+hint+'</div>'+trash+side+'</div>';
  }
  if(CH.phase==='preview'&&CH.preview){
    return '<div class="chpreview"><audio controls preload="metadata" src="'+e(CH.preview.url)+'"></audio><div class="chcompose" style="margin-top:8px"><button type="button" class="chmic" aria-label="Apagar" onclick="chPreviewDrop()">'+chTrashSvg()+'</button><button type="button" class="btn-gold" style="width:auto;margin:0;padding:12px 16px" onclick="chPreviewSend()">Enviar</button></div></div>';
  }
  return '<div class="chcompose"><textarea class="fld" id="chText" placeholder="Escreva uma mensagem"></textarea><button type="button" class="chmic" id="chMic" aria-label="Gravar áudio" onpointerdown="chMicDown(event)" ontouchstart="chMicDown(event)">'+chMicSvg()+'</button><button type="button" class="btn-gold" style="width:auto;margin:0;padding:12px 16px" onclick="chSendText()">Enviar</button></div>';
}
function chInsert(fields){
  return sb.from('casamento_chat').insert({lista_id:CH.listaId,autor_nome:chNome(CH.email),papel:'user',texto:fields.texto||null,audio_path:fields.audio_path||null,processado:false}).select('id');
}
function chSendText(){
  var el=document.getElementById('chText');var texto=(el?el.value:CH.draft||'').trim();
  if(!texto||CH.busy||!CH.listaId)return;
  CH.busy=true;CH.draft='';
  chInsert({texto:texto}).then(function(r){
    CH.busy=false;
    if(r.error){CH.note=r.error.message;CH.draft=texto;render();return}
    chLoad(true);
  }).catch(function(err){CH.busy=false;CH.note=(err&&err.message)||'Não enviei.';CH.draft=texto;render()});
}
function chLockSvg(closed){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="6" y="11" width="12" height="9" rx="2"/>'+(closed?'<path d="M8 11V8a4 4 0 0 1 8 0v3"/>':'<path d="M8 11V8a4 4 0 0 1 7.4-2"/>')+'</svg>'}
function chTrashSvg(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9 7V5h6v2M8 7l1 13h6l1-13"/></svg>'}
function chStopSvg(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>'}
function chBuzz(){try{if(navigator.vibrate)navigator.vibrate(18)}catch(err){}}
function chClock(){var s=Math.max(0,Math.floor((Date.now()-(CH.recAt||Date.now()))/1000));return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60)}
function chGesture(dx,dy){if(dx<=-88)return 'cancel';if(dy<=-70)return 'lock';return ''}
function chListen(){if(CH.listening)return;CH.listening=1;document.addEventListener('pointermove',chMicMove);document.addEventListener('pointerup',chMicUp);document.addEventListener('pointercancel',chMicCancel);document.addEventListener('touchmove',chMicMove,{passive:false});document.addEventListener('touchend',chMicUp);document.addEventListener('touchcancel',chMicCancel)}
function chUnlisten(){if(!CH.listening)return;CH.listening=0;document.removeEventListener('pointermove',chMicMove);document.removeEventListener('pointerup',chMicUp);document.removeEventListener('pointercancel',chMicCancel);document.removeEventListener('touchmove',chMicMove);document.removeEventListener('touchend',chMicUp);document.removeEventListener('touchcancel',chMicCancel)}
function chPoint(ev){var t=ev.touches?ev.touches[0]||ev.changedTouches[0]:ev;return {x:t.clientX,y:t.clientY,id:t.pointerId||t.identifier}}
function chTeardown(){if(CH.tick){clearInterval(CH.tick);CH.tick=0}if(CH.actx){try{CH.actx.close()}catch(err){}CH.actx=null;CH.an=null}}
function chArmMeters(){if(CH.tick)clearInterval(CH.tick);CH.tick=setInterval(function(){if(CH.phase!=='hold'&&CH.phase!=='locked'){clearInterval(CH.tick);CH.tick=0;return}var el=document.getElementById('chTimer');if(el)el.textContent=chClock();chLevels()},90)}
function chLevels(){if(!CH.an||!CH.buf)return;CH.an.getByteTimeDomainData(CH.buf);var bars=document.querySelectorAll('#chWave i');if(!bars.length)return;var step=Math.max(1,Math.floor(CH.buf.length/bars.length));for(var i=0;i<bars.length;i++){var v=Math.abs(CH.buf[i*step]-128)/64;bars[i].style.height=Math.max(3,Math.min(22,Math.round(v*22)))+'px'}}
function chGraph(stream){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{if(!CH.actx)CH.actx=new AC();if(CH.actx.state==='suspended')CH.actx.resume();var src=CH.actx.createMediaStreamSource(stream);var an=CH.actx.createAnalyser();an.fftSize=64;src.connect(an);CH.an=an;CH.buf=new Uint8Array(an.fftSize)}catch(err){}}
function chMicStart(){
  if(CH.rec||CH.starting||!navigator.mediaDevices||!window.MediaRecorder){if(!CH.rec&&!CH.starting){CH.note='Este navegador não grava áudio.';render()}return}
  CH.starting=true;CH.transcript='';CH.discard=false;CH.wantPreview=false;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){try{var sr=new SR();sr.lang='pt-BR';sr.continuous=true;sr.interimResults=true;sr.onresult=function(ev){var t='';for(var i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;CH.transcript=t};sr.start();CH.sr=sr}catch(e){CH.sr=null}}

    var rec;try{rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){stream.getTracks().forEach(function(t){t.stop()});throw e}
    var chunks=[];
    rec.ondataavailable=function(ev){if(ev.data&&ev.data.size)chunks.push(ev.data)};
    rec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});
      chTeardown();
      var discard=CH.discard,preview=CH.wantPreview;
      CH.rec=null;CH.starting=false;
      if(discard){CH.discard=false;CH.wantPreview=false;CH.transcript='';CH.phase='';return}
      var blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});
      if(preview){
        if(CH.preview&&CH.preview.url)try{URL.revokeObjectURL(CH.preview.url)}catch(err){}
        CH.preview={url:URL.createObjectURL(blob),blob:blob,mime:blob.type,texto:(CH.transcript||'').trim()};
        CH.phase='preview';CH.wantPreview=false;render();return;
      }

    if(CH.intent==='lock'){CH.intent='';chMicLock();return}
    if(CH.intent==='send'){CH.intent='';chMicFinish(false);return}

  }).catch(function(){CH.starting=false;CH.phase='';CH.note='Não consegui usar o microfone.';if(CH.sr){try{CH.sr.stop()}catch(e){}}CH.sr=null;render()});
}
function chUpload(blob,mime,texto){
  var ext=chExt(mime);
  var path=CH.listaId+'/'+chUuid()+'.'+ext;
  var wasPreview=CH.phase==='preview';
  CH.phase='';
  return sb.storage.from('casamento-audio').upload(path,blob,{contentType:mime||'audio/webm',upsert:false}).then(function(up){
    if(up.error)throw new Error(up.error.message);
    return chInsert({texto:texto||null,audio_path:path});
  }).then(function(r){
    if(r.error)throw new Error(r.error.message);

  }).catch(function(err){CH.note=(err&&err.message)||'Não enviei o áudio.';if(wasPreview&&CH.preview)CH.phase='preview';render()});

function chMicDown(ev){
  if(CH.gesture)return;
  if(ev&&ev.preventDefault)ev.preventDefault();
  if(CH.phase==='locked'||CH.phase==='preview')return;
  var p=chPoint(ev);
  CH.gesture='down';CH.x0=p.x;CH.y0=p.y;CH.dx=0;CH.dy=0;CH.holding=true;CH.holdAt=Date.now();CH.intent='';CH.pid=p.id;
  chListen();chMicStart();

function chMicMove(ev){
  if(CH.gesture!=='down'||CH.phase==='locked'||CH.phase==='preview')return;
  if(ev.cancelable)ev.preventDefault();
  var p=chPoint(ev);CH.dx=p.x-CH.x0;CH.dy=p.y-CH.y0;
  var g=chGesture(CH.dx,CH.dy);
  if(g==='cancel'){chMicAbort();return}
  if(g==='lock'){chMicLock();return}
  var hint=document.getElementById('chHint');if(hint)hint.style.opacity=String(Math.max(.3,1+CH.dx/140));
  var lock=document.getElementById('chLock');if(lock)lock.style.transform='translateY('+Math.max(CH.dy,-62)+'px)';

function chMicUp(ev){
  if(CH.gesture!=='down')return;
  CH.gesture='';CH.holding=false;chUnlisten();
  if(ev&&ev.clientX==null&&ev.changedTouches){var p=chPoint(ev);CH.dx=p.x-CH.x0;CH.dy=p.y-CH.y0}
  if(CH.phase==='locked'||CH.phase==='preview')return;
  var quick=Date.now()-CH.holdAt<320&&Math.abs(CH.dx)<28&&Math.abs(CH.dy)<28;
  if(!CH.rec){CH.intent=quick?'lock':'send';return}
  if(quick)chMicLock();else chMicFinish(false);

function chMicCancel(){if(CH.gesture!=='down')return;CH.gesture='';if(CH.phase==='hold')chMicAbort();else chUnlisten()}
function chMicLock(){if(CH.phase==='locked')return;CH.phase='locked';CH.holding=false;CH.gesture='';chUnlisten();render()}
function chMicFinish(preview){
  if(CH.phase!=='hold'&&CH.phase!=='locked'&&!CH.rec)return;
  CH.wantPreview=preview===true;CH.discard=false;chUnlisten();CH.gesture='';
  if(CH.sr){try{CH.sr.stop()}catch(e){}}CH.sr=null;
  if(CH.rec&&CH.rec.state!=='inactive'){try{CH.rec.stop()}catch(e){}}
  else render();
}
function chMicAbort(){
  CH.discard=true;CH.wantPreview=false;CH.phase='';CH.intent='';CH.holding=false;CH.gesture='';chBuzz();chUnlisten();
  if(CH.sr){try{CH.sr.stop()}catch(e){}}CH.sr=null;CH.transcript='';
  if(CH.rec&&CH.rec.state!=='inactive'){try{CH.rec.stop()}catch(e){CH.rec=null;chTeardown()}}
  else {CH.rec=null;chTeardown()}
  render();
}
function chPreviewDrop(){chBuzz();if(CH.preview&&CH.preview.url)try{URL.revokeObjectURL(CH.preview.url)}catch(err){}CH.preview=null;CH.phase='';CH.transcript='';render()}
function chPreviewSend(){if(!CH.preview||CH.busy)return;var p=CH.preview;chUpload(p.blob,p.mime,p.texto||'')}
function chPing(){
  if(CH.pinging)return;
  if(!CH.listaId)return;
  var client=sbClient();if(!client){CH.note='Não carregou o conector.';render();return}
  CH.pinging=true;render();
  client.auth.getSession().then(function(r){
    var token=r&&r.data&&r.data.session&&r.data.session.access_token;
    if(!token){CH.state='nologin';return null}
    return fetch(SB_URL+'/functions/v1/casamento-chat-ping',{method:'POST',headers:{'Authorization':'Bearer '+token,'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({lista_id:CH.listaId})});
  }).then(function(res){
    if(!res)return;
    if(res.status===200||res.status===503){CH.note=chPingMsg(res.status);return}
    return res.json().then(function(j){CH.note=(j&&j.erro)?String(j.erro):String(res.status)}).catch(function(){CH.note=String(res.status)});
  }).catch(function(){CH.note='Sem conexão com o assistente.'}).finally(function(){CH.pinging=false;render()});
}
/* Pull-to-refresh: mesma lógica do apto (só no topo, puxão além do limite, spinner de vidro). */
function loadData(){return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
var PTR={on:0,y0:0,x0:0,dy:0,busy:0,noteT:0};
function ptrTop(){return (window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0)<=0}
function ptrIgnore(t){
  if(document.getElementById('sh').classList.contains('open'))return 1;
  if(window.CH&&(CH.phase==='hold'||CH.phase==='locked'||CH.phase==='preview'))return 1;
  if(!t||!t.closest)return 0;
  return t.closest('#sh,#ov,#tb,select,input,textarea,button,a')?1:0;
}
function ptrShow(px,busy){
  var el=document.getElementById('ptr');
  el.classList.toggle('drag',!busy);
  el.classList.toggle('busy',!!busy);
  el.style.transform='translateY('+(Math.min(16,px*0.42-34))+'px)';
  el.style.opacity=String(Math.max(0,Math.min(1,(px-4)/36)));
  var s=el.querySelector('.spin');
  if(busy)s.style.transform='';else s.style.transform='rotate('+(px*3)+'deg)';

function ptrHide(){
  var el=document.getElementById('ptr');
  el.classList.remove('drag','busy');
  el.style.transform='';el.style.opacity='';
  var s=el.querySelector('.spin');if(s)s.style.transform='';
  PTR.dy=0;

function ptrNote(){
  var d=new Date(),n=document.getElementById('ptr-note');
  n.textContent='Atualizado às '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  n.classList.add('show');
  clearTimeout(PTR.noteT);
  PTR.noteT=setTimeout(function(){n.classList.remove('show')},2400);
}
function ptrRefresh(){
  if(PTR.busy)return;
  PTR.busy=1;PTR.on=0;
  ptrShow(72,1);
  var job=TAB==='conv'?cvReload():TAB==='chat'?chReload():loadData().then(function(d){D=d;render()});
  job.then(function(){ptrNote()}).catch(function(){}).then(function(){PTR.busy=0;ptrHide()});
}
document.addEventListener('touchstart',function(ev){
  if(PTR.busy||ev.touches.length!==1||!ptrTop()||ptrIgnore(ev.target)){PTR.on=0;return}
  PTR.on=1;PTR.y0=ev.touches[0].clientY;PTR.x0=ev.touches[0].clientX;PTR.dy=0;
},{passive:true});
document.addEventListener('touchmove',function(ev){
  if(!PTR.on||PTR.busy)return;
  var t=ev.touches[0],raw=t.clientY-PTR.y0,dx=t.clientX-PTR.x0;

  PTR.dy=Math.min(110,(raw-8)*0.55);
  if(ev.cancelable)ev.preventDefault();
  ptrShow(PTR.dy,0);
},{passive:false});
document.addEventListener('touchend',function(){
  if(!PTR.on)return;
  PTR.on=0;
  if(PTR.dy>=58)ptrRefresh();else ptrHide();
});
document.addEventListener('touchcancel',function(){PTR.on=0;if(!PTR.busy)ptrHide()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeSheet()});
(function(){var u=new URLSearchParams(location.search);if(u.get('embed')==='1')document.body.classList.add('embed');if(u.get('tab'))TAB=u.get('tab');if(u.get('mes'))MES=u.get('mes');if(u.get('hoje')){var H=u.get('hoje');hoje=function(){return H}}
  loadData().then(function(d){D=d;render();if(TAB==='conv')cvBoot();if(TAB==='chat')chOpen();if(u.get('sheet'))openSheet(u.get('sheet'))})
  .catch(function(err){document.getElementById('app').innerHTML='<div class="full card">Não consegui carregar data.json<br><span class="sub">'+e(err.message)+'</span></div>'})})();
</script></body></html>
