function iso(y,m,d){return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2)}
function hoje(){var d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
function dfull(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—'}
function dm(s){return s?s.slice(8,10)+'/'+s.slice(5,7):''}
function dt(s){var d=new Date(s);if(isNaN(d))return '';return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function addM(k,n){var y=+k.slice(0,4),m=+k.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+('0'+(m+1)).slice(-2)}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function hit(desc,kw){
  if(!kw)return false;
  if(kw.indexOf(' ')>=0)return (' '+desc+' ').indexOf(' '+kw+' ')>=0;
  var parts=desc.split(' ');
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(p===kw)return true;
    if(p.indexOf(kw)===0){
      var rest=p.slice(kw.length);
      if(rest && (/^\d+$/.test(rest) || kw.length>=5))return true;
    }
  }
  return false;
}
function catNomeDe(desc){
  var n=norm(desc);
  if(n.indexOf('PAGAMENTO')===0)return 'Pagamentos/Créditos de fatura';
  for(var i=0;i<SEED.length;i++){
    var s=SEED[i];
    if(s.nome.indexOf('Pagamentos')===0)continue;
    for(var k=0;k<s.kw.length;k++)if(hit(n,s.kw[k]))return s.nome;
  }
  return 'Outros/Não identificado';
}

/* ---------- parser Sicredi Visa Infinite (texto já extraído do PDF) ---------- */
function compraISO(dd,mm,yy,venc,parcelaN){
  var d=+dd,m=+mm,y;
  if(yy){y=+yy;if(y<100)y+=2000;return iso(y,m,d)}
  if(!venc){y=new Date().getFullYear();if(iso(y,m,d)>hoje())y--;return iso(y,m,d)}
  y=+venc.slice(0,4);var im=+venc.slice(5,7);
  if(m>im)y--;
  else if(m===im && (parcelaN||1)>1)y--;
  var out=iso(y,m,d);
  if((parcelaN||1)<=1 && out>venc)out=iso(y-1,m,d);
  return out;
}
function extractAmounts(rest){
  var re=/(-?\d{1,3}(?:\.\d{3})*,\d{2})/g,ms=[],m;
  while((m=re.exec(rest)))ms.push({i:m.index,s:m[1]});
  if(!ms.length)return null;
  var last=ms[ms.length-1],before=rest.slice(0,last.i).replace(/\s+$/,''),usd=null,cot=null;
  var cm=before.match(/(\d{1,4},\d{3,6})\s*$/);
  if(cm){cot=parseBR(cm[1]);before=before.slice(0,cm.index).replace(/\s+$/,'')}
  var um=before.match(/(-?\d{1,3}(?:\.\d{3})*,\d{2})\s*$/);
  if(um){usd=parseBR(um[1]);before=before.slice(0,um.index).replace(/\s+$/,'')}
  return {brl:parseBR(last.s),usd:usd,cot:cot,desc:before};
}
function parseLinhaTxn(line,venc){
  var t=String(line||'').replace(/\s+/g,' ').trim().replace(/(\d{1,3}(?:\.\d{3})*,\d{2})\s*-\s*$/,'-$1');
  var m=t.match(/^(\d{2})\/(\d{2})(?:\/(\d{2,4}))?(?:\s+(\d{2}:\d{2}))?\s+([\s\S]+)$/);
  var dd,mm,yy,hora,rest;
  if(m){dd=m[1];mm=+m[2];yy=m[3]||null;hora=m[4]||'';rest=m[5]}
  else{
    var m2=t.match(/^(\d{2})\/(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\.?(?:\s+(\d{2}:\d{2}))?\s+([\s\S]+)$/i);
    if(!m2)return null;
    dd=m2[1];mm=MABR[m2[2].toLowerCase()];yy=null;hora=m2[3]||'';rest=m2[4];
  }
  if(+dd<1||+dd>31||mm<1||mm>12)return null;
  rest=rest.replace(/^(\d{2}\/\d{2}(?:\/\d{2,4})?)\s+/,'');
  var am=extractAmounts(rest);
  if(!am)return {partial:true};
  var desc=am.desc,mod=null,pn=null,pt=null;
  var md=desc.match(/\b(Online|Presencial)\b/i);
  if(md){mod=/online/i.test(md[1])?'Online':'Presencial';desc=desc.replace(md[0],' ')}
  desc=desc.replace(/\b(\d{2})\/(\d{2})\b/,function(_,a,b){var n=+a,tot=+b;if(n>=1&&tot>=n&&tot<=48){pn=n;pt=tot;return ' '}return _});
  desc=desc.replace(/\b(R\$|US\$|USD|BRL)\b/gi,'').replace(/\$/g,'').replace(/\s+/g,' ').trim();
  if(!/[A-Za-zÀ-ÿ]{2,}/.test(desc))return null;
  return {partial:false,data:compraISO(dd,mm,yy,venc,pn),hora:hora||null,modalidade:mod,descricao:desc,parcela_n:pn,parcela_total:pt,valor_usd:am.usd,cotacao:am.cot,valor_brl:am.brl};
}
function cardFromLine(line){
  if(/^\d{2}\//.test(line))return null;
  var v=line.match(/virtual\D{0,16}(\d{4})/i);
  if(v)return 'virtual '+v[1];
  var m=line.match(/(?:cart[aã]o|final|pl[aá]stico)\D{0,24}(\d{4})/i);
  if(m)return m[1];
  var s=line.match(/\*{2,}(\d{4})/);
  if(s && /cart|final|sicredi|visa/i.test(line))return s[1];
  return null;
}
function isNoise(line){
  if(/^\d{2}\/\d{2}/.test(line) || /^\d{2}\/(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)/i.test(line))return false;
  return /total desta|total cart|subtotal|pagamento m[ií]nimo|limite|encargos vigentes|programa de recompensa|pontos|cet\b|iof adicional|rotativo|melhor dia|fechamento|fatura anterior|dispon[ií]vel|parcelamento|juros de mora|multa por|hist[oó]rico|moeda|para simples confer|sicredi\.com|p[aá]gina\s+\d|^\d+\/\d+$|valor\s*\(r\$\)|^data\b/i.test(line);
}
function acharVenc(lines){
  for(var i=0;i<lines.length;i++){
    if(!/vencimento/i.test(lines[i]))continue;
    var blob=lines.slice(i,i+4).join(' ');
    var m=blob.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(m)return m[3]+'-'+m[2]+'-'+m[1];
    var m2=blob.match(/(\d{1,2})\s+de\s+([a-zçãéõ]+)\s+de\s+(\d{4})/i);
    if(m2){var mm=MNOME[norm(m2[2]).toLowerCase()];if(mm)return iso(+m2[3],mm,+m2[1])}
  }
  return null;
}
function acharTotal(lines){
  for(var i=0;i<lines.length;i++){
    if(!/total desta fatura/i.test(lines[i]))continue;
    var blob=lines.slice(i,i+4).join(' ');
    var rs=blob.match(/R\$\s*(-?\d{1,3}(?:\.\d{3})*,\d{2})/);
    if(rs)return parseBR(rs[1]);
    var nums=blob.match(/-?\d{1,3}(?:\.\d{3})*,\d{2}/g)||[];
    var nz=nums.map(parseBR).filter(function(n){return Math.abs(n)>=0.01});
    if(nz.length)return nz[0];
    if(nums.length)return parseBR(nums[0]);
  }
  return null;
}
function parseSicredi(text){
  var lines=String(text||'').split(/\n/).map(function(s){return s.replace(/\s+/g,' ').trim()}).filter(Boolean);
  var venc=acharVenc(lines),total=acharTotal(lines),cartaoFinal=null,cartao=null,linhas=[],buf=null;
  var fm=text.match(/final\D{0,12}(\d{4})/i);if(fm)cartaoFinal=fm[1];
  function push(tx){if(tx&&!tx.partial){tx.cartao=cartao;linhas.push(tx)}}
  function flush(){if(!buf)return;push(parseLinhaTxn(buf,venc));buf=null}
  lines.forEach(function(line){
    var fin=line.match(/final\D{0,12}(\d{4})/i);if(fin)cartaoFinal=fin[1];
    var tx0=parseLinhaTxn(line,venc);
    var comeca=!!(tx0 && /[A-Za-zÀ-ÿ]{2,}/.test(line));
    if(!comeca){
      var c=cardFromLine(line);
      if(c){flush();cartao=c;if(!cartaoFinal && /^\d{4}$/.test(c))cartaoFinal=c;return}
      if(isNoise(line)){flush();return}
      if(buf){
        buf=buf+' '+line;
        if(buf.length>500){buf=null;return}
        var tx=parseLinhaTxn(buf,venc);
        if(tx&&!tx.partial){push(tx);buf=null}
      }
      return;
    }
    flush();
    if(tx0.partial)buf=line;else push(tx0);
  });
  flush();
  return {banco:'Sicredi',cartao_final:cartaoFinal||'desconhecido',vencimento:venc,ano:venc?+venc.slice(0,4):null,mes:venc?+venc.slice(5,7):null,total:total,linhas:linhas,sicredi:/sicredi/i.test(text)};
}
function itemsToLines(items){
  var rows=[];
  (items||[]).forEach(function(it){
    var t=it.str;if(t==null||!String(t).trim())return;
    var x=it.transform[4],y=it.transform[5],row=null;
    for(var i=0;i<rows.length;i++)if(Math.abs(rows[i].y-y)<2.4){row=rows[i];break}
    if(!row){row={y:y,parts:[]};rows.push(row)}
    row.parts.push({x:x,t:String(t),w:it.width||0});
  });
  rows.sort(function(a,b){return b.y-a.y});
  return rows.map(function(r){
    r.parts.sort(function(a,b){return a.x-b.x});
    var s='',end=null;
    r.parts.forEach(function(p){if(end!=null&&p.x>end+1.5)s+=' ';s+=p.t;end=p.x+(p.w||0)});
    return s.replace(/\s+/g,' ').trim();
  }).filter(Boolean);
}

/* ---------- projeção, assinaturas, período ---------- */
function serieKey(l){return norm(l.descricao).replace(/\b\d{2}\b/g,' ').replace(/\s+/g,' ').trim()+'|'+(l.parcela_total||0)+'|'+Math.round(Number(l.valor_brl)*100)+'|'+(l.data||'')+'|'+(l.cartao||'')}
function projecao(){
  var best={};
  DB.lans.forEach(function(l){
    if(!(l.parcela_n&&l.parcela_total&&l.parcela_n<l.parcela_total))return;
    if(isPag(l))return;
    var k=serieKey(l),score=l.ano*12+l.mes,cur=best[k];
    if(!cur||l.parcela_n>cur.parcela_n||(l.parcela_n===cur.parcela_n&&score>cur.score))best[k]=Object.assign({score:score},l);
  });
  var byMonth={},abertas=[];
  Object.keys(best).forEach(function(k){
    var l=best[k],faltam=l.parcela_total-l.parcela_n;
    abertas.push(l);
    for(var i=1;i<=faltam;i++){var ym=addM(l.ano+'-'+('0'+l.mes).slice(-2),i);byMonth[ym]=(byMonth[ym]||0)+Number(l.valor_brl)}
  });
  abertas.sort(function(a,b){return (b.parcela_total-b.parcela_n)-(a.parcela_total-a.parcela_n)||b.valor_brl-a.valor_brl});
  return {byMonth:byMonth,abertas:abertas};
}
function monthDiff(a,b){return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5))}
function assinaturas(){
  var g={};
  DB.lans.forEach(function(l){
    if(isPag(l))return;
    if(l.parcela_total&&l.parcela_total>1)return;
    var k=norm(l.descricao).replace(/\b\d{2}\b/g,' ').replace(/\s+/g,' ').trim();
    if(!k)return;(g[k]=g[k]||[]).push(l);
  });
  var out=[];
  Object.keys(g).forEach(function(k){
    var months={};
    g[k].forEach(function(l){months[l.ano+'-'+('0'+l.mes).slice(-2)]=l});
    var keys=Object.keys(months).sort();
    if(keys.length<2)return;
    var best=1,cur=1;
    for(var i=1;i<keys.length;i++){if(monthDiff(keys[i-1],keys[i])===1){cur++;if(cur>best)best=cur}else cur=1}
    var known=/SPOTIFY|NETFLIX|APPLE|PRUDENT|FITNESS|DASHLANE|AMAZON PRIME|MELIMAIS|ICLOUD|YOUTUBE|DISNEY|GLOBOPLAY/.test(k);
    if(best<3&&!(known&&best>=2))return;
    var vals=keys.map(function(m){return Number(months[m].valor_brl)});
    var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),varia=mn?(mx-mn)/mn:0;
    if(!known&&(best<3||varia>0.10))return;
    var last=vals[vals.length-1],prev=vals.length>1?vals[vals.length-2]:last;
    var anterior=prev;
    for(var j=vals.length-2;j>=0;j--){if(Math.abs(vals[j]-last)>0.009){anterior=vals[j];break}}
    var reaj=anterior>0&&last>anterior*1.02;
    var obs=reaj?('reajuste '+brl2(anterior)+' → '+brl2(last)):(varia<=0.10?'estável':'valor variável');
    out.push({nome:months[keys[keys.length-1]].descricao,valor:last,meses:keys.length,reaj:reaj,obs:obs,cat:months[keys[keys.length-1]].categoria_id});
  });
  out.sort(function(a,b){return b.valor-a.valor});
  return out;
}
function mesesComDados(ano){
  var s={};
  DB.lans.forEach(function(l){if(l.ano===ano&&!isPag(l))s[l.mes]=1});
  DB.fats.forEach(function(f){if(f.ano===ano)s[f.mes]=1});

function pageAll(table,orders){

/* ---------- PDF ---------- */
function sha256(bytes){
  if(!(window.crypto&&crypto.subtle))return Promise.resolve('sem-hash-'+bytes.byteLength);
  return crypto.subtle.digest('SHA-256',bytes).then(function(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')});
}
function extrairPdf(bytes){
  if(!window.pdfjsLib)return Promise.reject(new Error('Não consegui carregar o pdf.js.'));
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFWORKER;
  return pdfjsLib.getDocument({data:bytes}).promise.then(function(doc){
    var i=1,lines=[];
    function page(){
      if(i>doc.numPages)return lines.join('\n');
      return doc.getPage(i).then(function(pg){return pg.getTextContent().then(function(tc){lines=lines.concat(itemsToLines(tc.items));i++;return page()})});
    }
    return page();
  });
}
function abrirPdf(){if(!GR.user){GR.note='Entre na conta para importar.';render();return}document.getElementById('pdf').click()}
function onPdf(inp){var fs=[].slice.call(inp.files||[]);inp.value='';if(!fs.length)return;REV.fila=fs;lerProximo()}
function onDrop(ev){ev.preventDefault();var fs=ev.dataTransfer&&ev.dataTransfer.files;if(fs&&fs.length){REV.fila=[].slice.call(fs);lerProximo()}}
function lerProximo(){
  var f=REV.fila&&REV.fila.shift();
  if(!f){REV.modo=null;render();return}
  REV.modo='lendo';REV.nome=f.name;REV.err='';REV.ciente=0;render();
  f.arrayBuffer().then(function(buf){
    var a=new Uint8Array(buf),b=a.slice(0);
    return sha256(a.buffer.slice?a.slice(0).buffer:buf.slice(0)).then(function(hash){
      return extrairPdf(b).then(function(text){prepararRevisao(parseSicredi(text),hash,f.name)});
    });
  }).catch(function(err){REV.modo='erro';REV.err=(err&&err.message)||String(err);render()});
}
function prepararRevisao(p,hash,nome){
  REV.hash=hash;REV.nome=nome;REV.banco=p.banco;REV.cartao_final=p.cartao_final;REV.vencimento=p.vencimento;REV.ano=p.ano||new Date().getFullYear();REV.mes=p.mes||(new Date().getMonth()+1);REV.total=p.total;REV.sicredi=p.sicredi;
  REV.linhas=(p.linhas||[]).map(function(l){var nomeC=catNomeDe(l.descricao),c=catByNome(nomeC);return Object.assign({_drop:0,_cat:c?c.id:null,_catNome:nomeC},l)});
  var dupH=DB.fats.filter(function(f){return f.pdf_hash===hash})[0];
  var dupP=DB.fats.filter(function(f){return f.banco===REV.banco&&f.cartao_final===REV.cartao_final&&f.ano===REV.ano&&f.mes===REV.mes})[0];
  if(!REV.linhas.length){REV.modo='erro';REV.err='Não reconheci lançamentos. O leitor está pronto para a fatura Sicredi Visa Infinite.';render();return}
  if(dupH){REV.modo='dup-hash';REV.existente=dupH}
  else if(dupP){REV.modo='dup-periodo';REV.existente=dupP}
  else REV.modo='revisao';
  render();
}
function revCat(i,id){REV.linhas[i]._cat=id;var c=catById(id);REV.linhas[i]._catNome=c?c.nome:'';render()}
function revDrop(i){REV.linhas[i]._drop=REV.linhas[i]._drop?0:1;render()}
function somaRev(){return REV.linhas.reduce(function(s,l){if(l._drop)return s;if(norm(l.descricao).indexOf('PAGAMENTO')===0)return s;return s+Number(l.valor_brl||0)},0)}
function salvarRev(){
  var linhas=REV.linhas.filter(function(l){return !l._drop});
  if(!linhas.length){REV.err='Nenhum lançamento para salvar.';render();return}
  var soma=somaRev(),diff=REV.total==null?null:Math.round((soma-Number(REV.total))*100)/100;
  if((diff==null||Math.abs(diff)>0.05)&&!REV.ciente){REV.err='A soma não fechou com o total da fatura. Confira ou marque que quer salvar mesmo assim.';render();return}
  if(!REV.ano||!REV.mes){REV.err='Escolha o ano e o mês da fatura.';render();return}
  REV.modo='salvando';REV.err='';render();
  var antigo=REV.existente&&REV.modo!=='dup-hash'?REV.existente:null;
  var passo=antigo?GR.sb.from('gastos_faturas').delete().eq('id',antigo.id):Promise.resolve({error:null});
  passo.then(function(del){
    if(del&&del.error)throw del.error;
    return GR.sb.from('gastos_faturas').insert({user_id:GR.user.id,banco:REV.banco||'Sicredi',cartao_final:REV.cartao_final||'desconhecido',ano:+REV.ano,mes:+REV.mes,vencimento:REV.vencimento,total:REV.total!=null?REV.total:soma,pdf_hash:REV.hash,nome_arquivo:REV.nome}).select('id').single();
  }).then(function(ins){
    if(ins.error)throw ins.error;
    var fid=ins.data.id;
    var rows=linhas.map(function(l){return {user_id:GR.user.id,fatura_id:fid,ano:+REV.ano,mes:+REV.mes,data:l.data,hora:l.hora,modalidade:l.modalidade,descricao:l.descricao,parcela_n:l.parcela_n,parcela_total:l.parcela_total,valor_usd:l.valor_usd,cotacao:l.cotacao,valor_brl:l.valor_brl,categoria_id:l._cat,forma_pagamento:'cartao',origem:'pdf',cartao:l.cartao,recorrente:false}});
    return GR.sb.from('gastos_lancamentos').insert(rows);
  }).then(function(ins2){
    if(ins2.error)throw ins2.error;
    return loadAll();
  }).then(function(){
    escolherPeriodo();
    if(REV.fila&&REV.fila.length){lerProximo();return}
    REV.modo='salvo';REV.linhas=[];render();
  }).catch(function(err){REV.modo='revisao';REV.err=msgErro(err);render()});
}

  drawCharts();
  if(keep){var q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length)}catch(err){}}}
}

/* Pull-to-refresh, igual ao apto. */
var PTR={on:0,y0:0,x0:0,dy:0,busy:0,noteT:0};
function ptrTop(){return (window.scrollY||document.documentElement.scrollTop||0)<=0}
function ptrIgnore(t){if(document.getElementById('sh').classList.contains('open'))return 1;if(!t||!t.closest)return 0;if(GR.rec)return 1;return t.closest('#sh,#ov,#tabs,#gsubbar,.gmenu,select,input,textarea,button,a')?1:0}
function ptrShow(px,busy){var el=document.getElementById('ptr');el.classList.toggle('drag',!busy);el.classList.toggle('busy',!!busy);el.style.transform='translateY('+(Math.min(16,px*0.42-34))+'px)';el.style.opacity=String(Math.max(0,Math.min(1,(px-4)/36)));var s=el.querySelector('.spin');if(busy)s.style.transform='';else s.style.transform='rotate('+(px*3)+'deg)'}
function ptrHide(){var el=document.getElementById('ptr');el.classList.remove('drag','busy');el.style.transform='';el.style.opacity='';var s=el.querySelector('.spin');if(s)s.style.transform='';PTR.dy=0}
function ptrNote(){var d=new Date(),n=document.getElementById('ptr-note');n.textContent='Atualizado às '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);n.classList.add('show');clearTimeout(PTR.noteT);PTR.noteT=setTimeout(function(){n.classList.remove('show')},2400)}
function ptrRefresh(){if(PTR.busy||(REV.modo&&REV.modo!=='salvo'))return;PTR.busy=1;PTR.on=0;ptrShow(72,1);var job=GR.user?loadAll():Promise.resolve();job.then(function(){render();ptrNote()}).catch(function(){}).then(function(){PTR.busy=0;ptrHide()})}
document.addEventListener('touchstart',function(ev){if(PTR.busy||ev.touches.length!==1||!ptrTop()||ptrIgnore(ev.target)){PTR.on=0;return}PTR.on=1;PTR.y0=ev.touches[0].clientY;PTR.x0=ev.touches[0].clientX;PTR.dy=0},{passive:true});
document.addEventListener('touchmove',function(ev){if(!PTR.on||PTR.busy)return;var t=ev.touches[0],raw=t.clientY-PTR.y0,dx=t.clientX-PTR.x0;if(!ptrTop()||raw<8||Math.abs(dx)>Math.abs(raw)){if(raw<0||Math.abs(dx)>12){PTR.on=0;ptrHide()}return}PTR.dy=Math.min(110,(raw-8)*0.55);if(ev.cancelable)ev.preventDefault();ptrShow(PTR.dy,0)},{passive:false});
document.addEventListener('touchend',function(){if(!PTR.on)return;PTR.on=0;if(PTR.dy>=58)ptrRefresh();else ptrHide()});
document.addEventListener('touchcancel',function(){PTR.on=0;if(!PTR.busy)ptrHide()});

function boot(){
  var u;try{u=new URLSearchParams(location.search)}catch(err){u=new URLSearchParams('')}
  if(u.get('selftest')==='1'){var r=selftest();document.getElementById('app').innerHTML='<pre id="st" class="full" style="white-space:pre-wrap;font:13px ui-monospace,monospace">'+e(r.text)+'</pre>';document.getElementById('tabs').innerHTML='';return}
  var t=u.get('tab');if(t&&/^(resumo|lanc|cat|ass|metas|grav|import)$/.test(t))TAB=t;
  var g=u.get('grv');if(g&&/^(gravar|aprovar|hist)$/.test(g))GRV=g;
  var pdf=document.getElementById('pdf');if(pdf)pdf.addEventListener('change',function(){onPdf(this)});
  grInit();
}
if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('app'))boot();
</script></body></html>
